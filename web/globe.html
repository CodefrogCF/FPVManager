<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <title>FPVManager – 3D Globe Prototype</title>

    <script>
    window.CESIUM_BASE_URL =
        "https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/";
    </script>

    <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">

    <style>
    html, body, #globe {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #101820;
        font-family: Arial, sans-serif;
    }

    #info {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 12px 16px;
        background: rgba(12, 20, 28, 0.88);
        color: white;
        border-radius: 8px;
        font-size: 13px;
        pointer-events: none;
        max-width: 350px;
    }
    </style>
</head>

<body>
    <div id="globe"></div>
    <div id="info">FPVManager – Loading 3D terrain...</div>

    <script>

    
    function sendToFlutter(type, payload = {}) {
        const message = JSON.stringify({
            source: "fpvmanager-globe",
            type,
            ...payload
        });

        // Native Flutter Android/iOS bridge.
        if (window.FPVBridge?.postMessage) {
            window.FPVBridge.postMessage(message);
        }

        // Flutter Web iframe bridge.
        if (window.parent !== window) {
            window.parent.postMessage(
                message,
                window.location.origin
            );
        }
    }

    let activeViewer = null;
    let activeBaseLayer = null;

    let uasDataSource = null;
    let uasRequestedVisible = false;
    let uasFillOpacity = 0.20;
    let uasDownloadedAtUtc = null;
    let uasFeatureCount = null;

    const MAP_STYLES = {
        satellite: {
            layer: "ch.swisstopo.swissimage",
            extension: "jpeg",
            maximumLevel: 19
        },
        topographic: {
            layer: "ch.swisstopo.pixelkarte-farbe",
            extension: "jpeg",
            maximumLevel: 19
        },
        relief: {
            layer: "ch.swisstopo.swissalti3d-reliefschattierung",
            extension: "png",
            maximumLevel: 18
        }
    };

    function createMapProvider(style) {
        const config = MAP_STYLES[style];

        if (!config) {
            throw new Error(`Unknown map style: ${style}`);
        }

        return new Cesium.UrlTemplateImageryProvider({
            url:
                "https://wmts.geo.admin.ch/1.0.0/" +
                `${config.layer}/default/current/3857/` +
                "{z}/{x}/{y}." + config.extension,

            tilingScheme:
                new Cesium.WebMercatorTilingScheme(),

            maximumLevel: config.maximumLevel,

            credit: new Cesium.Credit("© swisstopo")
        });
    }

    function resetCamera() {
        activeViewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(
                8.4,
                46.7,
                180000
            ),
            orientation: {
                heading: 0,
                pitch: Cesium.Math.toRadians(-55),
                roll: 0
            },
            duration: 1.5
        });
    }

    function flyToCoordinates(command) {
        const latitude = Number(command.latitude);
        const longitude = Number(command.longitude);
        const altitude = Number(command.altitude);

        if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude) ||
            !Number.isFinite(altitude) ||
            Math.abs(latitude) > 90 ||
            Math.abs(longitude) > 180 ||
            altitude <= 0
        ) {
            throw new Error("Invalid camera coordinates");
        }

        activeViewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(
                longitude,
                latitude,
                altitude
            ),
            orientation: {
                heading: 0,
                pitch: Cesium.Math.toRadians(-60),
                roll: 0
            },
            duration: 1.5
        });
    }

    function setMapStyle(style) {
        const provider = createMapProvider(style);
        const newLayer = new Cesium.ImageryLayer(provider);

        activeViewer.imageryLayers.add(newLayer, 0);

        if (activeBaseLayer) {
            activeViewer.imageryLayers.remove(
                activeBaseLayer,
                true
            );
        }

        activeBaseLayer = newLayer;

        sendToFlutter("map-style-changed", {
            style
        });
    }

    function sendUasStatus({
        visible,
        loading = false,
        error = null
    }) {
        sendToFlutter("uas-zones-status", {
            visible,
            loading,
            error,
            fillOpacity: uasFillOpacity,
            downloadedAtUtc: uasDownloadedAtUtc,
            featureCount: uasFeatureCount
        });
    }

    function setUasFillOpacity(opacity) {
        if (
            typeof opacity !== "number" ||
            !Number.isFinite(opacity) ||
            opacity < 0 ||
            opacity > 1
        ) {
            throw new Error("Invalid UAS fill opacity");
        }

        uasFillOpacity = opacity;

        if (!uasDataSource) {
            return;
        }

        const entities = uasDataSource.entities;

        entities.suspendEvents();

        try {
            for (const entity of entities.values) {
                if (entity.polygon) {
                    entity.polygon.material =
                        new Cesium.ColorMaterialProperty(
                            Cesium.Color.RED.withAlpha(
                                uasFillOpacity
                            )
                        );
                }
            }
        } finally {
            entities.resumeEvents();
        }
    }

    async function setUasZonesVisible(
        visible,
        geojson = null,
        downloadedAtUtc = null,
        replace = false
    ) {
        uasRequestedVisible = visible;

        // Hide without deleting the currently loaded data.
        if (!visible && !replace) {
            if (uasDataSource) {
                uasDataSource.show = false;
            }

            sendToFlutter("uas-zone-cleared");

            sendUasStatus({
                visible: false
            });

            return;
        }

        // Reuse the existing Cesium data source.
        if (uasDataSource && !replace) {
            uasDataSource.show = visible;

            sendUasStatus({
                visible
            });

            return;
        }

        if (
            !geojson ||
            geojson.type !== "FeatureCollection" ||
            !Array.isArray(geojson.features)
        ) {
            sendUasStatus({
                visible: uasDataSource?.show === true,
                error: "Invalid or missing UAS GeoJSON"
            });

            return;
        }

        sendUasStatus({
            visible: uasDataSource?.show === true,
            loading: true
        });

        try {
            const replacement =
                await Cesium.GeoJsonDataSource.load(
                    geojson,
                    {
                        clampToGround: true,

                        stroke:
                            Cesium.Color.RED.withAlpha(0.85),

                        fill:
                            Cesium.Color.RED.withAlpha(
                                uasFillOpacity
                            ),

                        strokeWidth: 2,

                        credit: new Cesium.Credit(
                            "© BAZL / FOCA"
                        )
                    }
                );

            await activeViewer.dataSources.add(
                replacement
            );

            const previous = uasDataSource;

            uasDataSource = replacement;
            uasDataSource.show = uasRequestedVisible;

            if (previous) {
                activeViewer.dataSources.remove(
                    previous,
                    true
                );
            }

            uasDownloadedAtUtc = downloadedAtUtc;
            uasFeatureCount = geojson.features.length;

            setUasFillOpacity(uasFillOpacity);

            sendToFlutter("uas-zone-cleared");

            sendUasStatus({
                visible: uasDataSource.show
            });

            console.log(
                "[FPVManager] UAS dataset imported:",
                uasFeatureCount,
                "features"
            );
        } catch (error) {
            console.error(
                "[FPVManager] UAS import failed:",
                error
            );

            sendUasStatus({
                visible: uasDataSource?.show === true,
                error: String(error.message || error)
            });
        }
    }

    const pendingTransfers = new Map();

    function handleTransfer(command) {
        switch (command.type) {
            case "transfer-start":
                pendingTransfers.set(
                    command.id,
                    []
                );
                return true;

            case "transfer-chunk": {
                const parts = pendingTransfers.get(
                    command.id
                );

                if (!parts) {
                    throw new Error(
                        "Unknown data transfer"
                    );
                }

                parts.push(command.data);
                return true;
            }

            case "transfer-complete": {
                const parts = pendingTransfers.get(
                    command.id
                );

                if (!parts) {
                    throw new Error(
                        "Unknown data transfer"
                    );
                }

                pendingTransfers.delete(command.id);

                executeCommand(parts.join(""));
                return true;
            }

            case "transfer-abort":
                pendingTransfers.delete(command.id);
                return true;

            default:
                return false;
        }
    }

    async function queryTerrainElevation(command) {
        const requestId = String(
            command.requestId ?? ""
        );

        const latitude = command.latitude;
        const longitude = command.longitude;

        try {
            if (!activeViewer) {
                throw new Error("Globe is not initialized");
            }

            if (
                typeof latitude !== "number" ||
                typeof longitude !== "number" ||
                !Number.isFinite(latitude) ||
                !Number.isFinite(longitude) ||
                latitude < -90 ||
                latitude > 90 ||
                longitude < -180 ||
                longitude > 180
            ) {
                throw new Error(
                    "Invalid terrain coordinates"
                );
            }

            const terrainProvider =
                activeViewer.terrainProvider;

            if (
                !terrainProvider ||
                terrainProvider instanceof
                    Cesium.EllipsoidTerrainProvider
            ) {
                throw new Error(
                    "Detailed terrain data unavailable"
                );
            }

            const position =
                Cesium.Cartographic.fromDegrees(
                    longitude,
                    latitude
                );

            let sampled;
            let samplingMethod;

            if (terrainProvider.availability) {
                sampled =
                    await Cesium.sampleTerrainMostDetailed(
                        terrainProvider,
                        [position],
                        true
                    );

                samplingMethod = "most-detailed";
            } else {
                // Fallback for terrain providers without
                // advertised tile availability.
                sampled = await Cesium.sampleTerrain(
                    terrainProvider,
                    12,
                    [position],
                    true
                );

                samplingMethod = "level-12";
            }

            const height = sampled[0]?.height;

            if (!Number.isFinite(height)) {
                throw new Error(
                    "No terrain elevation available " +
                    "at these coordinates"
                );
            }

            sendToFlutter(
                "terrain-elevation-result",
                {
                    requestId,
                    latitude,
                    longitude,
                    heightMeters: height,
                    samplingMethod
                }
            );
        } catch (error) {
            console.error(
                "[FPVManager] Terrain query failed:",
                error
            );

            sendToFlutter(
                "terrain-elevation-result",
                {
                    requestId,
                    error: String(
                        error?.message ?? error
                    )
                }
            );
        }
    }

    let spotsDataSource = null;
    let lastSpotRevision = -1;

    function setSpotMarkers(command) {
        if (!activeViewer) {
            throw new Error("Globe is not ready");
        }

        const spots = command.spots;
        const revision = command.revision;

        if (
            !Array.isArray(spots) ||
            spots.length > 5000 ||
            !Number.isSafeInteger(revision) ||
            revision < 0
        ) {
            throw new Error("Invalid spot marker data");
        }

        if (revision < lastSpotRevision) {
            return;
        }

        // Validate the entire incoming dataset before
        // changing the displayed entities.
        const incoming = new Set();

        for (const spot of spots) {
            if (
                !Number.isSafeInteger(spot.id) ||
                spot.id <= 0 ||
                typeof spot.name !== "string" ||
                !Number.isFinite(spot.latitude) ||
                !Number.isFinite(spot.longitude) ||
                spot.latitude < -90 ||
                spot.latitude > 90 ||
                spot.longitude < -180 ||
                spot.longitude > 180 ||
                incoming.has(spot.id)
            ) {
                throw new Error("Invalid spot feature");
            }

            incoming.add(spot.id);
        }

        if (!spotsDataSource) {
            spotsDataSource = new Cesium.CustomDataSource(
                "FPVManager Saved Spots"
            );

            void activeViewer.dataSources.add(
                spotsDataSource
            );
        }

        const entities = spotsDataSource.entities;

        entities.suspendEvents();

        try {
            const expectedIds = new Set();

            for (const spot of spots) {
                const id = `fpv-spot-${spot.id}`;

                expectedIds.add(id);

                const position =
                    Cesium.Cartesian3.fromDegrees(
                        spot.longitude,
                        spot.latitude,
                        0
                    );

                let entity = entities.getById(id);

                if (!entity) {
                    entity = entities.add({
                        id,
                        name: spot.name,
                        position,
                        point: {
                            pixelSize: 13,
                            color: Cesium.Color.CYAN,
                            outlineColor: Cesium.Color.BLACK,
                            outlineWidth: 2,
                            heightReference:
                                Cesium.HeightReference.CLAMP_TO_GROUND
                        },
                        label: {
                            text: spot.name,
                            font: "12px sans-serif",
                            fillColor: Cesium.Color.WHITE,
                            outlineColor: Cesium.Color.BLACK,
                            outlineWidth: 3,
                            style:
                                Cesium.LabelStyle.FILL_AND_OUTLINE,
                            pixelOffset:
                                new Cesium.Cartesian2(0, -25),
                            heightReference:
                                Cesium.HeightReference.CLAMP_TO_GROUND,
                            distanceDisplayCondition:
                                new Cesium.DistanceDisplayCondition(
                                    0,
                                    15000
                                )
                        }
                    });
                } else {
                    entity.name = spot.name;
                    entity.position = position;
                    entity.label.text = spot.name;
                }
            }

            for (const entity of [...entities.values]) {
                if (!expectedIds.has(entity.id)) {
                    entities.removeById(entity.id);
                }
            }
        } finally {
            entities.resumeEvents();
        }

        lastSpotRevision = revision;
    }

    function executeCommand(rawCommand) {
        try {
            const command = typeof rawCommand === "string"
                ? JSON.parse(rawCommand)
                : rawCommand;

            if (handleTransfer(command)) {
                return;
            }

            if (!activeViewer) {
                throw new Error("Globe is not initialized");
            }

            switch (command.type) {
                case "reset-camera":
                    resetCamera();
                    break;

                case "fly-to":
                    flyToCoordinates(command);
                    break;

                case "set-map-style":
                    setMapStyle(command.style);
                    break;

                case "set-uas-zones":
                    void setUasZonesVisible(
                        command.visible === true,
                        command.geojson ?? null,
                        command.downloadedAtUtc ?? null
                    );
                    break;

                case "replace-uas-zones":
                    void setUasZonesVisible(
                        uasRequestedVisible,
                        command.geojson ?? null,
                        command.downloadedAtUtc ?? null,
                        true
                    );
                    break;

                case "set-uas-opacity":
                    setUasFillOpacity(command.opacity);

                    sendUasStatus({
                        visible: uasDataSource?.show === true,
                        loading: false
                    });
                    break;

                case "query-terrain-elevation":
                    void queryTerrainElevation(command);
                    break;

                case "set-spot-markers":
                    setSpotMarkers(command);
                    break;

                case "focus-spot": {
                    const latitude = command.latitude;
                    const longitude = command.longitude;
                    const terrainHeight = command.terrainHeightMeters;
                    const range = command.rangeMeters;

                    if (
                        !Number.isFinite(latitude) ||
                        !Number.isFinite(longitude) ||
                        !Number.isFinite(terrainHeight) ||
                        !Number.isFinite(range) ||
                        latitude < -90 ||
                        latitude > 90 ||
                        longitude < -180 ||
                        longitude > 180 ||
                        range < 50 ||
                        range > 10000
                    ) {
                        throw new Error("Invalid spot focus parameters");
                    }

                    const target = Cesium.Cartesian3.fromDegrees(
                        longitude,
                        latitude,
                        terrainHeight
                    );

                    const boundingSphere = new Cesium.BoundingSphere(
                        target,
                        1
                    );

                    activeViewer.camera.flyToBoundingSphere(
                        boundingSphere,
                        {
                            duration: 2.5,
                            offset: new Cesium.HeadingPitchRange(
                                Cesium.Math.toRadians(0),
                                Cesium.Math.toRadians(-55),
                                range
                            )
                        }
                    );

                    break;
                }

                default:
                    throw new Error(
                        `Unsupported command: ${command.type}`
                    );
            }
        } catch (error) {
            console.error("Globe command error:", error);

            sendToFlutter("globe-error", {
                message: error.message
            });
        }
    }

    // Called directly by the native WebView.
    window.FPVManager = {
        receive: executeCommand
    };

    // Commands received from Flutter Web.
    window.addEventListener("message", (event) => {
        if (
            window.parent === window ||
            event.source !== window.parent ||
            event.origin !== window.location.origin
        ) {
            return;
        }

        executeCommand(event.data);
    });

    async function initializeGlobe() {
        const info = document.getElementById("info");

        const imageryProvider =
            new Cesium.UrlTemplateImageryProvider({
                url:
                "https://wmts.geo.admin.ch/1.0.0/" +
                "ch.swisstopo.swissimage/default/current/" +
                "3857/{z}/{x}/{y}.jpeg",
                tilingScheme:
                new Cesium.WebMercatorTilingScheme(),
                maximumLevel: 19,
                credit: new Cesium.Credit("© swisstopo")
            });

        let terrainProvider;
        let terrainAvailable = false;

        try {
            terrainProvider =
                await Cesium.CesiumTerrainProvider.fromUrl(
                "https://3d.geo.admin.ch/" +
                "ch.swisstopo.terrain.3d/v1/"
            );

            terrainAvailable = true;
            } catch (error) {
                console.error("Terrain loading failed:", error);
                terrainProvider =
                new Cesium.EllipsoidTerrainProvider();
            }

        const viewer = new Cesium.Viewer("globe", {
            baseLayerPicker: false,
            baseLayer: new Cesium.ImageryLayer(imageryProvider),
            terrainProvider: terrainProvider,
            animation: false,
            timeline: false,
            geocoder: false,
            homeButton: false,
            fullscreenButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            infoBox: false,
            selectionIndicator: false
        });

        viewer.scene.globe.depthTestAgainstTerrain = true;
        activeViewer = viewer;
        activeBaseLayer = viewer.imageryLayers.get(0);

        // Initial camera position: Swiss Alps
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(
                8.4,
                46.7,
                180000
            ),
            orientation: {
            heading: 0,
            pitch: Cesium.Math.toRadians(-55),
            roll: 0
            }
        });

        info.textContent = terrainAvailable
            ? "FPVManager | Swiss 3D terrain loaded"
            : "FPVManager | Terrain unavailable – flat fallback";

        sendToFlutter("globe-ready", {
            terrainAvailable: terrainAvailable
        });


        // Display coordinates and elevation on click.
        viewer.screenSpaceEventHandler.setInputAction(
            function (event) {

                const picked = viewer.scene.pick(event.position);

                const entity = picked?.id instanceof Cesium.Entity
                    ? picked.id
                    : picked?.primitive?.id;

                const isUasZone =
                    uasDataSource !== null &&
                    uasDataSource.show &&
                    entity instanceof Cesium.Entity &&
                    uasDataSource.entities.contains(entity);

                const isSavedSpot =
                    spotsDataSource !== null &&
                    entity instanceof Cesium.Entity &&
                    spotsDataSource.entities.contains(entity);

                if (isSavedSpot) {
                    const spotId = Number(
                        entity.id.replace("fpv-spot-", "")
                    );

                    sendToFlutter("uas-zone-cleared");

                    sendToFlutter("spot-selected", {
                        id: spotId
                    });

                    return;
                }

                // Any non-spot click dismisses the spot selection.
                sendToFlutter("spot-cleared");

                if (isUasZone) {
                    const rawAttributes =
                        entity.properties?.getValue(
                            viewer.clock.currentTime
                        ) ?? {};

                    const attributes = {};

                    for (const [key, value] of
                        Object.entries(rawAttributes).slice(0, 50)) {

                        if (value === null || value === undefined) {
                            continue;
                        }

                        let formattedValue;

                        try {
                            formattedValue = typeof value === "object"
                                ? JSON.stringify(value)
                                : String(value);
                        } catch {
                            formattedValue = "[Unsupported value]";
                        }

                        attributes[String(key).slice(0, 120)] =
                            formattedValue.slice(0, 1000);
                    }

                    sendToFlutter("uas-zone-selected", {
                        id: String(entity.id).slice(0, 160),
                        name: String(
                            entity.name || "UAS Geographical Zone"
                        ).slice(0, 160),
                        attributes
                    });

                    return;
                }

                sendToFlutter("uas-zone-cleared");

                const ray =
                    viewer.camera.getPickRay(event.position);

                if (!ray) return;

                const position =
                    viewer.scene.globe.pick(ray, viewer.scene);

                if (!position) return;

                const coordinates =
                    Cesium.Cartographic.fromCartesian(position);

                const longitude = Cesium.Math.toDegrees(
                    coordinates.longitude
                );

                const latitude = Cesium.Math.toDegrees(
                    coordinates.latitude
                );

                const altitude = coordinates.height;

                info.textContent =
                    `Lat: ${latitude.toFixed(6)} | ` +
                    `Lon: ${longitude.toFixed(6)} | ` +
                    `Elevation: ${altitude.toFixed(1)} m`;

                sendToFlutter("point-selected", {
                    latitude: latitude,
                    longitude: longitude,
                    altitude: altitude
                });
            },
            Cesium.ScreenSpaceEventType.LEFT_CLICK
        );
    }

    initializeGlobe().catch((error) => {
        console.error(error);

        document.getElementById("info").textContent =
            "Failed to initialize 3D globe: " + error.message;

        sendToFlutter("globe-error", {
            message: error.message
        });
    });
    </script>
</body>
</html>
