<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <title>FPVManager – 3D Globe Prototype</title>

    <script>
    window.CESIUM_BASE_URL =
        "./cesium/";
    </script>

    <script src="cesium/Cesium.js"></script>

    <link rel="stylesheet"
        href="cesium/Widgets/widgets.css">

    <style>
    :root {
        --map-surface: rgba(16, 20, 15, .92);
        --map-text: #e0e4db;
        --map-accent: #a0d39a;
        --map-outline: #424940;
        --stick-fill: rgba(160, 211, 154, .10);
        --stick-thumb: rgba(160, 211, 154, .32);
    }
    @media (prefers-color-scheme: light) {
        :root {
            --map-surface: rgba(247, 251, 241, .94);
            --map-text: #181d17;
            --map-accent: #3b693a;
            --map-outline: #c2c9bd;
        }
    }
    html, body, #globe {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #10140f;
        font-family: Roboto, Arial, sans-serif;
    }

    #info {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 12px 16px;
        background: var(--map-surface);
        color: var(--map-text);
        border: 1px solid var(--map-outline);
        border-radius: 12px;
        font-size: 13px;
        pointer-events: none;
        max-width: 350px;
    }

    #weather-legend {
        position: absolute; bottom: max(12px, env(safe-area-inset-bottom));
        right: max(10px, env(safe-area-inset-right)); z-index: 18;
        max-width: min(400px, 76vw); padding: 7px 10px;
        background: var(--map-surface); color: var(--map-text);
        border: 1px solid var(--map-outline); border-radius: 12px;
        font-size: 12px; line-height: 1.45; pointer-events: none;
    }
    #weather-legend[hidden] { display: none; }
    #ground-controls { position: absolute; left: max(16px, env(safe-area-inset-left));
        bottom: max(74px, calc(env(safe-area-inset-bottom) + 58px)); z-index: 20; }
    #ground-controls[hidden] { display: none; }
    [data-stick] { width: clamp(92px, 20vw, 116px); aspect-ratio: 1; border-radius: 50%;
        border: 1px solid #ffffff66; background: var(--stick-fill); touch-action: none;
        user-select: none; position: relative; box-shadow: 0 0 0 1px #10140f55; }
    [data-stick-thumb] { position: absolute; width: 34%; height: 34%; left: 33%; top: 33%;
        border-radius: 50%; background: var(--stick-thumb); border: 1px solid #ffffff88;
        box-sizing: border-box; pointer-events: none; }
    #ground-controls::after { content: 'Move'; display: block; text-align: center;
        color: #ffffffb3; font-size: 11px; margin-top: 4px; pointer-events: none; }
    @media (max-width: 480px) { #info { top: 8px; left: 8px; right: 8px;
        padding: 8px 10px; max-width: none; font-size: 12px; } }

    /* Keep source notices readable over imagery and allow narrow screens to wrap. */
    #globe .cesium-widget-credits {
        box-sizing: border-box;
        max-width: 100%;
        padding: 4px 6px;
        background: var(--map-surface);
        color: var(--map-text);
        font-size: 12px;
        line-height: 1.4;
    }
    #globe .cesium-widget-credits a { color: var(--map-accent); }
    </style>
</head>

<body>
    <div id="globe"></div>
    <div id="weather-legend" hidden role="status" aria-live="polite"></div>
    <div id="info">FPVManager – Loading 3D terrain...</div>
    <div id="ground-controls" hidden aria-label="Ground view controls">
        <div data-stick role="group" aria-label="Walk joystick. Drag to walk; arrow keys also move.">
            <div data-stick-thumb></div>
        </div>
    </div>

    <script src="globe_bridge.js"></script>
    <script src="terrain_service.js"></script>
    <script src="map_providers.js"></script>
    <script src="ground_navigation.js"></script>
    <script src="route_editor.js"></script>
    <script src="obstacle_layers.js"></script>
    <script src="uas_zone_styles.js"></script>
    <script src="weather_overlay.js"></script>
    <script src="globe.js"></script>
</body>
</html>
