<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <title>FPVManager – 3D Globe Prototype</title>

    <script>
    window.CESIUM_BASE_URL =
        "./cesium/";
    </script>

    <script src="cesium/Cesium.js"></script>

    <link rel="stylesheet"
        href="cesium/Widgets/widgets.css">

    <style>
    html, body, #globe {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #101820;
        font-family: Arial, sans-serif;
    }

    #info {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 12px 16px;
        background: rgba(12, 20, 28, 0.88);
        color: white;
        border-radius: 8px;
        font-size: 13px;
        pointer-events: none;
        max-width: 350px;
    }

    /* Keep source notices readable over imagery and allow narrow screens to wrap. */
    #globe .cesium-widget-credits {
        box-sizing: border-box;
        max-width: 100%;
        padding: 4px 6px;
        background: rgba(12, 20, 28, 0.88);
        font-size: 12px;
        line-height: 1.4;
    }
    </style>
</head>

<body>
    <div id="globe"></div>
    <div id="info">FPVManager – Loading 3D terrain...</div>

    <script src="globe_bridge.js"></script>
    <script src="terrain_service.js"></script>
    <script src="map_providers.js"></script>
    <script src="globe.js"></script>
</body>
</html>
