name: fpvmanager
description: "Open-source FPV flight planning and situational awareness app with 3D maps, weather, routes, and Swiss aviation data."

publish_to: 'none'

version: 0.11.0+11

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  web: ^1.1.1
  pointer_interceptor: ^0.10.1+3
  webview_flutter: ^4.14.1
  http: ^1.6.0
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_selector: 1.1.0
  geolocator: 14.1.2
  image: 4.12.0
  archive: 4.5.2
  crypto: 3.0.7
  cryptography: 2.9.0
  xml: 7.0.1
  webview_flutter_windows: 1.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

