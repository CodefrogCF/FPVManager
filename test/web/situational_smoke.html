<!doctype html><html lang="en"><meta charset="utf-8"><title>FPVManager mobility and OSINT smoke</title>
<style>body{margin:0;background:#101820;color:#fff;font:14px system-ui}h1{font-size:19px;margin:12px}iframe{width:100%;height:62vh;border:0}pre{white-space:pre-wrap;padding:12px}</style>
<h1 id="status">Running mobility and OSINT smoke…</h1>
<iframe id="map" title="Actual Cesium with synthetic terrain"></iframe><pre id="log"></pre>
<script>
const frame=document.getElementById('map'),output=document.getElementById('log'),pending=new Map(),errors=[],states={};
let session,next=0,terrain,following;
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const check=(v,m)=>{if(!v)throw new Error(m);};
const log=m=>{output.textContent+='PASS: '+m+'\n';};
async function until(p,m,timeout=25000){const end=performance.now()+timeout;while(!p()){
  if(errors.length)throw new Error(errors.join('; '));if(performance.now()>end)throw new Error(m+' timeout');await pause(50);}}
window.addEventListener('message',event=>{
  if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
  let data;try{data=JSON.parse(event.data);}catch{return;}
  if(data.type==='globe-ready')session=data.sessionId;
  if(data.type==='terrain-status')terrain=data;
  if(data.type==='road-navigation-follow')following=data.follow;
  if(data.type==='situational-status')states[data.id]=data;
  if(data.type==='globe-error')errors.push(data.message);
  if(data.type==='command-result'){
    const p=pending.get(data.requestId);if(!p)return;clearTimeout(p.timer);pending.delete(data.requestId);
    data.ok?p.resolve(data.result):p.reject(new Error(data.error));
  }
});
function command(type,fields={}){return new Promise((resolve,reject)=>{
  const requestId=String(++next),timer=setTimeout(()=>reject(new Error(type+' timeout')),25000);
  pending.set(requestId,{resolve,reject,timer});
  frame.contentWindow.postMessage(JSON.stringify({version:1,sessionId:session,requestId,type,...fields}),location.origin);
});}
(async()=>{
  const prepared=new URLSearchParams(location.search).has('prepared');
  frame.src=prepared?'/prepared-globe.html?cachedMaps=1':'/terrain-globe.html'+(new URLSearchParams(location.search).has('roads')?'?realImagery=1':'');await until(()=>session&&terrain?.state==='ready','startup');
  const win=frame.contentWindow,v=win.fixtureViewer,C=win.Cesium;
  if(prepared){
    // This fixture uses the ordinary viewer, not terrain-fixture.js.
    const viewer=win.__preparedTestViewer;
    check(viewer,'Prepared viewer test hook missing');
    const metadata=await(await fetch('/offline/maps/prepared.json')).json();
    const latitude=(metadata.south+metadata.north)/2,longitude=(metadata.west+metadata.east)/2;
    await command('set-map-style',{style:'topographic'});
    const sampled=await command('query-terrain-elevation',{latitude,longitude});
    check(Number.isFinite(sampled.heightMeters),'Prepared terrain height missing');
    viewer.camera.setView({destination:C.Cartesian3.fromDegrees(longitude,latitude,1500),orientation:{heading:0,pitch:-Math.PI/2,roll:0}});
    await pause(800);
    let outside=false;try{await command('query-terrain-elevation',{latitude,longitude:metadata.east+.01});}catch{outside=true;}
    check(outside,'Prepared terrain invents outside heights');
    check(viewer.imageryLayers.get(0).imageryProvider.url.includes('/prepared/'),'Prepared imagery provider missing');
    await command('enter-ground-view',{latitude,longitude});await command('exit-ground-view');
    log('Prepared real Cesium terrain/imagery load, sampled ellipsoid height '+sampled.heightMeters.toFixed(2)+' m; outside heights are unavailable; ground view remains usable');
    document.getElementById('status').textContent='PASS — prepared offline region';return;
  }
  v.camera.setView({destination:C.Cartesian3.fromDegrees(8.55,47.45,18000),orientation:{heading:0,pitch:-Math.PI/2,roll:0}});
  const point=(id,coordinates=[8.55,47.45])=>({id,name:'Fixture '+id,detail:'Synthetic source position; not operational information.',
    timestampUtc:new Date().toISOString(),geometry:{type:'Point',coordinates}});
  const road={...point('road'),geometry:{type:'LineString',coordinates:[[8.5,47.43],[8.55,47.45],[8.6,47.46]]}};
  for(const [id,features] of [['road',[road]],['traffic',[{...point('traffic'),category:'congestion'}]],['traffic-counters',[point('counter',[8.56,47.45])]],['aircraft',[point('aircraft',[8.57,47.46])]]]){
    await command('set-situational-overlay',{id,visible:true,features});
  }
  const source=id=>v.dataSources.getByName('FPVManager '+id)[0];
  if(new URLSearchParams(location.search).has('avalanche')){
    const warning={id:'slf-fixture',name:'Synthetic regional warning',detail:'Synthetic test, no current warning. <tag>escaped</tag>',level:3,
      timestampUtc:new Date(Date.now()-3600000).toISOString(),validFromUtc:new Date(Date.now()-1800000).toISOString(),validUntilUtc:new Date(Date.now()+3600000).toISOString(),
      geometry:{type:'Polygon',coordinates:[[[8.5,47.4],[8.6,47.4],[8.6,47.5],[8.5,47.5],[8.5,47.4]],[[8.54,47.44],[8.54,47.46],[8.56,47.46],[8.56,47.44],[8.54,47.44]]]}};
    await command('set-situational-overlay',{id:'avalanche',visible:true,opacity:.4,features:[warning]});
    const entity=source('avalanche').entities.values[0];
    check(source('avalanche').entities.values.length===1,'Duplicate avalanche entities');
    check(entity.polygon.hierarchy.getValue().holes.length===1,'Missing warning hole');
    check(Math.abs(entity.polygon.material.color.getValue().alpha-.4)<.001,'Warning opacity missing');
    check(entity.description.getValue().includes('&lt;tag&gt;'),'Warning HTML is not escaped');
    check(entity.show,'Valid warning hidden');
    await command('set-map-style',{style:'relief'});check(source('avalanche'),'Map style lost warning');
    await command('enter-ground-view',{latitude:47.45,longitude:8.55});await command('exit-ground-view');
    check(source('avalanche'),'Ground view lost warning');
    await command('set-situational-overlay',{id:'avalanche',visible:true,opacity:.4,features:[{...warning,validUntilUtc:new Date(Date.now()-1).toISOString()}]});
    check(!source('avalanche').entities.values[0].show,'Expired warning visible');
    await command('set-situational-overlay',{id:'avalanche',visible:false});check(!source('avalanche'),'Warning cleanup failed');
    log('Actual Cesium renders SLF fixture with a hole, opacity, escaped text, expiry and independent style/ground-view lifecycle');
    document.getElementById('status').textContent='PASS — avalanche renderer';return;
  }
  check(source('road')&&source('traffic')&&source('aircraft'),'Independent vector sources missing');
  check(source('traffic-counters')&&source('traffic-counters').entities.values[0].show,'Counter source missing or current measurement hidden');
  check(source('traffic').entities.values[0].point.color.getValue().equals(C.Color.fromCssColorString('#ef9847')),'Traffic category color missing');
  await command('set-situational-overlay',{id:'traffic-counters',visible:true,features:[{...point('old-counter'),timestampUtc:new Date(Date.now()-181000).toISOString()}]});
  check(!source('traffic-counters').entities.values[0].show,'Old counter measurement remains current on the map');
  log('Traffic categories render distinctly and independent counter measurements expire after three minutes');
  check(source('road').entities.values[0].polyline.clampToGround.getValue()===true,'Road route is not ground clamped');
  check(source('aircraft').entities.values[0].point.heightReference.getValue()===C.HeightReference.CLAMP_TO_GROUND,'Aircraft marker silently elevated');
  await command('set-situational-overlay',{id:'traffic',visible:false});
  check(!source('traffic')&&source('road')&&source('aircraft'),'Removing traffic affected another overlay');
  let rejected=false;
  try{await command('set-situational-overlay',{id:'aircraft',visible:true,features:[point('bad',[8,147])]});}catch{rejected=true;}
  check(rejected&&source('aircraft'),'Invalid replacement lost a valid snapshot');
  log('Actual Cesium renders independent road and aircraft sources; removing traffic and rejecting invalid updates retains other data');
  const compass=win.document.getElementById('map-compass');
  v.camera.setView({orientation:{heading:Math.PI/2,pitch:-Math.PI/2,roll:0}});
  await pause(100);check(!compass.hidden,'Globe compass is hidden');compass.click();
  check(Math.min(v.camera.heading,Math.PI*2-v.camera.heading)<.01,'Globe compass did not align north');
  const saved=v.camera.positionWC.clone();
  await command('set-road-navigation',{active:true,follow:true,position:{latitude:47.45,longitude:8.55,heading:90}});
  try{await until(()=>v.camera.positionCartographic.height>1000&&v.camera.positionCartographic.height<2000,'Navigation terrain follow');}
  catch(error){throw new Error(`${error.message}: camera=${v.camera.positionCartographic.height}, ground=${v.scene.globe.getHeight(C.Cartographic.fromDegrees(8.55,47.45))}, loaded=${v.scene.globe.tilesLoaded}`);}
  const marker=v.entities.getById('road-navigation-position');
  check(marker&&marker.point.heightReference.getValue()===C.HeightReference.CLAMP_TO_GROUND,'Navigation marker missing or not clamped');
  check(!v.scene.screenSpaceCameraController.enableInputs,'Follow camera did not disable orbital input');
  await command('set-road-navigation',{active:true,follow:true,cameraDistanceMeters:100,position:{latitude:47.45,longitude:8.55,heading:90}});
  check(v.camera.positionCartographic.height>1000&&v.camera.positionCartographic.height<1150,'Close zoom reset terrain readiness');
  compass.click();await until(()=>following===false,'Compass free state');
  check(v.scene.screenSpaceCameraController.enableInputs,'Compass did not release follow');
  check(Math.min(v.camera.heading,Math.PI*2-v.camera.heading)<.01,'Navigation compass did not align north');
  compass.click();await until(()=>following===true&&v.camera.positionCartographic.height>1000&&v.camera.positionCartographic.height<1150,'Compass close follow state');
  check(!v.scene.screenSpaceCameraController.enableInputs&&Math.abs(v.camera.heading-Math.PI/2)<.01,'Compass did not restore tilted heading follow');
  check(Math.abs(v.camera.pitch+65*Math.PI/180)<.01,'Follow pitch changed');
  log('Compass aligns north in globe/navigation; second navigation tap restores tilted follow and retains the close 100m zoom');
  await command('set-road-navigation',{active:true,follow:false,cameraDistanceMeters:100,position:{latitude:47.4501,longitude:8.5501,heading:90}});
  const free=v.camera.positionWC.clone();
  await command('set-road-navigation',{active:true,follow:false,cameraDistanceMeters:100,position:{latitude:47.4502,longitude:8.5502,heading:90}});
  check(C.Cartesian3.distance(free,v.camera.positionWC)<.01,'Free camera unexpectedly follows');
  check(v.entities.getById('road-navigation-position')===marker,'Position updates recreate the marker');
  compass.click();check(v.scene.screenSpaceCameraController.enableInputs,'First compass tap from free mode unexpectedly enabled follow');
  check(Math.min(v.camera.heading,Math.PI*2-v.camera.heading)<.01,'Compass from free mode did not align north');
  compass.click();await until(()=>!v.scene.screenSpaceCameraController.enableInputs&&v.camera.positionCartographic.height>1000&&v.camera.positionCartographic.height<1150,'Free mode compass recenter');
  await command('set-road-navigation',{active:true,follow:true,position:null});check(!marker.show,'Stale GPS marker remains visible');
  await command('set-road-navigation',{active:false,follow:true});
  check(!v.entities.getById('road-navigation-position')&&v.scene.screenSpaceCameraController.enableInputs,'Navigation cleanup failed');
  check(C.Cartesian3.distance(saved,v.camera.positionWC)<.01,'Navigation did not restore the original camera');
  await command('set-rendering-paused',{paused:true});check(!v.useDefaultRenderLoop,'Hidden map still renders');
  await command('set-rendering-paused',{paused:false});check(v.useDefaultRenderLoop,'Map render loop did not resume');
  log('Actual Cesium follows GPS/terrain, retains one ground marker, supports free camera, hides stale fixes, restores camera and pauses/resumes rendering');
  if(new URLSearchParams(location.search).has('roads')){
    await command('set-map-style',{style:'topographic'});
    check(v.scene.globe.maximumScreenSpaceError===1,'Topographic detail budget not applied');
    await command('set-situational-overlay',{id:'roads',visible:true,opacity:.8});
    await until(()=>['ready','failed'].includes(states.roads?.state),'Road WMS response');
    check(states.roads.state==='ready','Official road tiles did not load');
    const count=v.imageryLayers.length,layer=v.imageryLayers.get(count-1);
    check(layer.imageryProvider.layers==='ch.swisstopo.swisstlm3d-strassen','Wrong road source');
    await command('set-map-style',{style:'satellite'});
    check(v.imageryLayers.length===count&&v.imageryLayers.contains(layer),'Base style lost the road overlay');
    await command('set-situational-overlay',{id:'roads',visible:true,opacity:.5});
    check(layer.alpha===.5&&v.imageryLayers.length===count,'Opacity recreated the road layer');
    await command('set-situational-overlay',{id:'roads',visible:false,opacity:.5});
    check(v.imageryLayers.length===count-1,'Road layer not removed');
    await command('set-map-style',{style:'topographic'});
    await command('set-situational-overlay',{id:'roads',visible:true,opacity:.8});
    await until(()=>states.roads?.state==='ready','Road overlay restored');
    const stable=v.imageryLayers.get(v.imageryLayers.length-1),provider=stable.imageryProvider;
    // Exercise real renderer scheduling while repeatedly changing the viewport.
    for(const [lon,lat,height] of [[8.55,47.45,2500],[8.57,47.43,6500],[8.54,47.44,3000],
      [8.56,47.47,9000],[8.55,47.45,2200],[8.58,47.46,6000],[8.54,47.45,2500],[8.55,47.45,3500]]){
      v.camera.setView({destination:C.Cartesian3.fromDegrees(lon,lat,height),orientation:{heading:.4,pitch:-Math.PI/2,roll:0}});
      await pause(150);
      check(v.imageryLayers.contains(stable)&&stable.show,'Panning removed or hid the road overlay');
    }
    // A real Cesium error event must retain loaded imagery. Recovery of that
    // same tile clears the failure without rebuilding the layer.
    const tile=provider.tilingScheme.positionToTileXY(C.Cartographic.fromDegrees(8.5,46.8),8);
    const tileError=new C.TileProviderError(provider,'Synthetic temporary tile failure',tile.x,tile.y,8,0,new Error('fixture'));
    provider.errorEvent.raiseEvent(tileError);
    await until(()=>states.roads?.state==='failed','Partial tile failure status');
    check(v.imageryLayers.contains(stable)&&tileError.retry,'Tile failure removed imagery or refused bounded retry');
    await provider.requestImage(tile.x,tile.y,8,new C.Request());
    await until(()=>states.roads?.state==='ready','Road tile recovered in place');
    check(v.imageryLayers.contains(stable),'Recovery replaced the road layer');
    log('Repeated pan/zoom and a synthetic Cesium tile failure retain the same visible road layer; successful tile retry recovers in place');
    v.camera.setView({destination:C.Cartesian3.fromDegrees(8.55,47.45,3500),orientation:{heading:0,pitch:-Math.PI/2,roll:0}});
    // Check that this layer actually supplies rendered textures. tilesLoaded
    // also waits for unrelated imagery/terrain work after rapid camera changes.
    // Pinned Cesium internals are used only by this renderer test harness.
    await until(()=>v.scene.globe._surface._tilesToRender.some(tile=>
      tile.data?.imagery?.some(i=>i.readyImagery?.imageryLayer===stable)), 'Road imagery rendered');
    check(stable.show&&v.imageryLayers.contains(stable),'Rendered road layer unexpectedly hidden');
    await command('set-situational-overlay',{id:'roads',visible:false,opacity:.8});
    check(!v.imageryLayers.contains(stable),'Road overlay could not be disabled after recovery');
    await command('set-situational-overlay',{id:'roads',visible:true,opacity:.8});
    await until(()=>states.roads?.state==='ready','Road overlay re-enabled after recovery');
    log('Official transparent swissTLM3D roads load with the Topo map, survive style changes, update opacity and recover after toggling');
    document.getElementById('status').textContent='PASS — roads and topographic imagery';return;
  }
  if(new URLSearchParams(location.search).has('navigation')){
    document.getElementById('status').textContent='PASS — road navigation renderer';return;
  }
  for(const id of ['heliports','wildfire'])await command('set-situational-overlay',{id,visible:true,opacity:.6});
  await until(()=>['heliports','wildfire'].every(id=>['ready','failed'].includes(states[id]?.state)),'Official WMS response');
  for(const id of ['heliports','wildfire']){
    if(states[id].state==='ready')log(id+' official WMS tile loaded; this does not verify source freshness');
    else log(id+' unavailable: non-blocking status is reported without a globe initialization error');
  }
  check(!errors.length,'Generic globe initialization error');
  await command('enter-ground-view',{latitude:47.45,longitude:8.55});
  await command('exit-ground-view');
  check(source('road')&&source('aircraft'),'Ground view discarded awareness sources');
  log('Ground view remains usable with the new layers enabled');
  document.getElementById('status').textContent='PASS — mobility and OSINT smoke';
})().catch(error=>{document.getElementById('status').textContent='FAIL — '+error.message;output.textContent+='\n'+error.stack;});
</script></html>
