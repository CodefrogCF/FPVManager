<!doctype html>
<html lang="en"><meta charset="utf-8"><title>FPVManager offline renderer smoke</title>
<style>body{margin:0;background:#101820;color:#fff;font:15px system-ui}h1{font-size:20px;padding:12px;margin:0}iframe{width:100%;height:65vh;border:0}pre{white-space:pre-wrap;padding:12px;margin:0}</style>
<h1 id="status">Running offline renderer smoke…</h1>
<iframe id="map" title="Actual Cesium renderer" src="/globe.html?offline=1"></iframe><pre id="log"></pre>
<script>
const frame = document.getElementById('map'), output = document.getElementById('log');
const log = text => { output.textContent += text + '\n'; };
const pending = new Map();
let session, next = 0, lastStatus, readyWaiters = [], failed = false;
function fail(error) { failed = true; document.getElementById('status').textContent = 'FAIL: ' + error; log(String(error)); }
function readyAfter(previous) { return new Promise((resolve, reject) => {
  const timer = setTimeout(() => reject(new Error('Ready timeout')), 30000);
  readyWaiters.push(value => { if (value !== previous) { clearTimeout(timer); resolve(value); return true; } return false; });
}); }
window.addEventListener('message', event => {
  if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
  let data; try { data = JSON.parse(event.data); } catch { return; }
  if (data.source !== 'fpvmanager-globe' || data.version !== 1) return;
  if (data.type === 'globe-ready') {
    session = data.sessionId;
    readyWaiters = readyWaiters.filter(waiter => !waiter(session));
  }
  if (data.type === 'uas-zones-status') lastStatus = data;
  if (data.type === 'globe-error') fail(data.message);
  if (data.type === 'command-result' && data.sessionId === session) {
    const request = pending.get(data.requestId); if (!request) return;
    clearTimeout(request.timer); pending.delete(data.requestId);
    data.ok ? request.resolve(data.result) : request.reject(new Error(data.error));
  }
});
async function transmit(type, fields, requestId) {
  const envelope = { version: 1, sessionId: session, requestId };
  const raw = JSON.stringify({ ...envelope, type, ...fields });
  const post = value => frame.contentWindow.postMessage(JSON.stringify(value), location.origin);
  const chunkSize = 32 * 1024;
  if (raw.length <= chunkSize) { frame.contentWindow.postMessage(raw, location.origin); return; }
  post({ ...envelope, type: 'transfer-start', commandType: type, length: raw.length });
  let index = 0;
  for (let offset = 0; offset < raw.length; offset += chunkSize) {
    post({ ...envelope, type: 'transfer-chunk', index: index++, data: raw.slice(offset, offset + chunkSize) });
    await new Promise(resolve => setTimeout(resolve, 0));
  }
  post({ ...envelope, type: 'transfer-complete' });
}
function command(type, fields = {}) { return new Promise((resolve, reject) => {
  const requestId = String(++next);
  const timer = setTimeout(() => { pending.delete(requestId); reject(new Error(type + ' timeout')); }, 20000);
  pending.set(requestId, { resolve, reject, timer });
  transmit(type, fields, requestId).catch(error => { clearTimeout(timer); pending.delete(requestId); reject(error); });
}); }
const zone = { type: 'FeatureCollection', features: [{ type: 'Feature', id: 'fixture',
  properties: { name: 'Local integration fixture' }, geometry: { type: 'Polygon',
  coordinates: [[[8.4,46.7],[8.5,46.7],[8.5,46.8],[8.4,46.7]]] } }] };
async function settings() {
  await command('set-map-style', { style: 'topographic' });
  await command('fly-to', { latitude:46.73, longitude:8.43, altitude:10000 });
  await command('set-uas-opacity', { opacity: 0.45 });
  const count = new URLSearchParams(location.search).get('spots') === '10000' ? 10000 : 1;
  const spots = Array.from({length: count}, (_, i) => ({id:i+1,name:'Local fixture '+(i+1),latitude:46.68+Math.floor(i/100)*.001,longitude:8.38+(i%100)*.001}));
  const started = performance.now();
  await command('set-spot-markers', { revision: 1, spots });
  log('PASS: '+count+' markers acknowledged in '+(performance.now()-started).toFixed(0)+' ms (command time, not FPS)');
  if (count === 10000) {
    try { await command('set-spot-markers', { revision: 2, spots: [...spots, {...spots[0], id:10001}] }); throw new Error('Expected marker limit error'); }
    catch (error) { if (!String(error).includes('Invalid spot marker')) throw error; }
    log('PASS: oversized marker snapshot rejected without replacing valid markers');
  }
  await command('set-uas-zones', { visible: true, geojson: zone, downloadedAtUtc: '2026-10-19T00:00:00Z' });
  if (!lastStatus?.visible || lastStatus.featureCount !== 1 || lastStatus.fillOpacity !== 0.45) throw new Error('Incorrect UAS status');
}
async function checkWorker() {
  const processor = new frame.contentWindow.Cesium.TaskProcessor('createGeometry');
  let timer;
  try {
    await Promise.race([
      processor.scheduleTask({ subTasks: [] }),
      new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('Local geometry worker timeout')), 20000); })
    ]);
  } finally { clearTimeout(timer); processor.destroy(); }
}
(async () => {
  await readyAfter(null); log('PASS: local Cesium/WebGL initializes without online map resources');
  await checkWorker(); log('PASS: bundled geometry worker executes and returns a result');
  await settings(); log('PASS: map style, opacity, spot markers and real GeoJSON import acknowledged');
  try { await command('query-terrain-elevation', { latitude:46.7, longitude:8.4 }); throw new Error('Expected terrain error'); }
  catch (error) { if (!String(error).includes('Detailed terrain data unavailable')) throw error; }
  log('PASS: unavailable offline terrain returns a correlated error');
  const previous = session, reloaded = readyAfter(previous);
  await command('reload-renderer'); await reloaded; await settings();
  log('PASS: new renderer session after real iframe reload accepts restored settings');
  await new Promise(resolve => setTimeout(resolve, 3000));
  if (!failed) { document.getElementById('status').textContent = 'PASS — offline renderer and bridge smoke'; log('PASS: renderer remains free of render errors'); }
})().catch(fail);
</script></html>
