<script src="../../web/cesium/Cesium.js"></script>

<script src="scenery_editor_pick_fixture.js"></script>
<script>
(async()=>{
 const C=Cesium,A=FPVSceneryAlignment,M=FPVSceneryEditorMath,checks=[],check=(ok,text)=>{if(!ok)throw Error(text);checks.push(text);document.body.dataset.progress=text;},wait=ms=>new Promise(r=>setTimeout(r,ms));let viewer,manager,editor;
 const pose={longitude:13.8,latitude:52.4,ellipsoidHeightM:100,rotationDeg:0,pitchDeg:0,rollDeg:0,scale:1,opacity:1};
 const doc={schemaVersion:1,id:'editor-test',name:'Synthetic geometry',anchor:{longitude:13.8,latitude:52.4,heightM:100,reference:'WGS84_ELLIPSOID'},assets:[{id:'mesh',provider:'bundled',model:{localBounds:[0,0,0,20,20,20]}}]};
 const region=[[13.79995,52.39995],[13.80005,52.39995],[13.80005,52.40005],[13.79995,52.40005]];doc.replacement={buildings:{regions:[region]},terrain:{regions:[{polygon:region}]}};
 const item={id:doc.id,name:doc.name,author:'FPVManager tests',license:'CC0-1.0',heightDatum:'WGS84 ellipsoid',enabled:true,alignment:pose,heightAlignmentMode:'fixed',physicalCollisionsEnabled:false,loadRadiusM:2500,unloadRadiusM:4000,assets:[{kind:'glb',path:'synthetic.glb'}]};
 try{
  C.Ion.defaultAccessToken='';viewer=new C.Viewer('globe',{baseLayer:false,terrainProvider:new C.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,baseLayerPicker:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});
  viewer.scene.globe.baseColor=C.Color.DARKGRAY;viewer.camera.lookAt(M.xyz(C,pose),new C.HeadingPitchRange(0,-.65,80));viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);
  let loads=0;manager=FPVSceneryManager.create(C,viewer,{position:()=>({longitude:13.8,latitude:52.4,height:100}),fetchCatalog:async()=>({schemaVersion:1,sceneries:[item]}),modelFactory:async()=>{loads++;return C.Model.fromGltfAsync({url:'../fixtures/scenery/imported_triangle.glb',modelMatrix:A.modelMatrix(C,pose),scale:1,allowPicking:true});}});
  await manager.initialize();for(let i=0;i<300&&!manager.previewModels(doc.id)[0]?.ready;i++)await wait(16);manager.tick(true);const model=manager.previewModels(doc.id)[0];check(model?.ready,'actual Cesium model is ready for editing');
  let submitted,cancelled=0,ground=82,groundGate=null,saveWatchdog;editor=FPVSceneryEditor.create(C,viewer,{manager,onSubmit:v=>submitted=v,onCancel:()=>cancelled++,setTimer:fn=>{saveWatchdog=fn;return 1;},clearTimer:()=>{},sampleGround:async()=>groundGate?await groundGate.promise:ground,terrainKey:()=>viewer.terrainProvider});
  const camera=C.Cartesian3.clone(viewer.camera.positionWC),matrix=C.Matrix4.clone(model.modelMatrix),entities=viewer.entities.values.length;
  await editor.begin({definitions:[doc],id:doc.id,token:'first'});await wait(200);if(innerWidth<680){const r=document.getElementById('fpv-scenery-editor').getBoundingClientRect();check(r.top>innerHeight/2+15&&r.right<=innerWidth,'mobile panel leaves the globe center and handles available');}
  const panel=()=>document.getElementById('fpv-scenery-editor'),action=key=>panel().querySelector(`[data-action="${key}"]`).click(),field=(key,value)=>{const input=panel().querySelector(`[data-field="${key}"]`);input.value=value;input.dispatchEvent(new Event('change',{bubbles:true}));},value=key=>Number(panel().querySelector(`[data-field="${key}"]`).value);
  action('replacement');await wait(20);check(viewer.entities.getById('fpv-replacement-buildings-0')&&viewer.entities.getById('fpv-replacement-terrain-0'),'editor shows separate geographic building and terrain replacement outlines');action('replacement');await wait(20);check(!viewer.entities.getById('fpv-replacement-buildings-0'),'replacement outlines can be hidden without applying masks');

  check(Math.abs(model.color.alpha-.45)<1e-6&&model.scale===1.5,'numeric scale and transparency update the rendered model');check(C.Matrix4.equalsEpsilon(model.modelMatrix,A.modelMatrix(C,{...pose,rotationDeg:25,pitchDeg:12}),1e-7),'numeric HPR uses the shared Cesium transform');

  action('top');await wait(30);check(viewer.camera.pitch< -1.5,'top-down view is available');action('perspective');await wait(30);check(viewer.camera.pitch> -1,'perspective alignment view is available');

  async function renderFrame(){await new Promise(resolve=>requestAnimationFrame(()=>{viewer.clock.tick();viewer.render();resolve();}));}
  async function handlePixel(axis){const deadline=performance.now()+5000;while(performance.now()<deadline){const before=viewer.entities.getById('fpv-edit-'+axis);await renderFrame();if(before!==viewer.entities.getById('fpv-edit-'+axis))continue;const p=screen(point(axis));if(p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&p.x>=0&&p.y>=0&&p.x<canvas.clientWidth&&p.y<canvas.clientHeight)return p;}throw Error('Handle is not rendered in the viewport: '+axis);}

   let cover;if(axis==='north'&&location.search.includes('coverHandle=1')){cover=viewer.scene.primitives.add(new C.PointPrimitiveCollection());cover.add({position:point(axis),pixelSize:26,color:C.Color.MAGENTA,disableDepthTestDistance:Infinity,id:{id:'test-cover'}});await renderFrame();check(viewer.scene.drillPick(p).some(hit=>hit.id?.id==='test-cover'),'a real GPU primitive overlaps the north handle');}
   const dx=p.x-origin.x,dy=p.y-origin.y,len=Math.hypot(dx,dy),end={x:p.x+dx/len*12,y:p.y+dy/len*12},key=axis==='east'?'longitude':axis==='north'?'latitude':'ellipsoidHeightM',before=value(key),rect=canvas.getBoundingClientRect();
   const dispatch=(name,pos,buttons)=>canvas.dispatchEvent(new PointerEvent(name,{pointerId:type==='touch'?8:7,pointerType:type,isPrimary:true,bubbles:true,cancelable:true,clientX:pos.x+rect.left,clientY:pos.y+rect.top,button:0,buttons}));
   dispatch('pointerdown',p,1);check(viewer.scene.screenSpaceCameraController.enableInputs===false,'pointer acquires the requested translation handle ('+axis+')');dispatch('pointermove',end,1);check(value(key)>before,'drag changes the requested coordinate before release ('+axis+')');dispatch(cancel?'pointercancel':'pointerup',end,0);if(cover)viewer.scene.primitives.remove(cover);await renderFrame();
  }
  const oldLon=value('longitude');await drag('east','mouse');check(value('longitude')>oldLon,'mouse translation handle updates geographic longitude');if(location.search.includes('manualFrames=1'))viewer.useDefaultRenderLoop=false;const oldLat=value('latitude');await drag('north','touch');check(value('latitude')>oldLat,'touch translation handle updates geographic latitude');if(location.search.includes('manualFrames=1')){check(!viewer.useDefaultRenderLoop,'translation works with the normal render loop suspended');viewer.useDefaultRenderLoop=true;}
  await wait(50);viewer.render();const ring=viewer.entities.getById('fpv-edit-heading').polyline.positions.getValue(viewer.clock.currentTime),from=screen(ring[6]),to=screen(ring[7]),oldHeading=value('rotationDeg');
  for(const [name,p]of [['pointerdown',from],['pointermove',to],['pointerup',to]])canvas.dispatchEvent(new PointerEvent(name,{pointerId:12,pointerType:'mouse',isPrimary:true,bubbles:true,cancelable:true,clientX:p.x,clientY:p.y,button:0,buttons:name==='pointerup'?0:1}));await wait(20);check(Math.abs(value('rotationDeg')-oldHeading+7.5)<.01,'rotation ring follows the actual local ENU plane in perspective');
  const beforeCancel=value('ellipsoidHeightM');await drag('up','touch',true);check(Math.abs(value('ellipsoidHeightM')-beforeCancel)<1e-4,'cancelled touch drag restores its initial transform');check(viewer.scene.screenSpaceCameraController.enableInputs,'camera input is restored after dragging');
  action('snap');await wait(30);check(Math.abs(value('ellipsoidHeightM')-82)<1e-4,'terrain snap uses a real supplied elevation');
  const ref=panel().querySelector('[aria-label="Altitude reference"]');ref.value='TERRAIN_RELATIVE';ref.dispatchEvent(new Event('change'));await wait(20);field('ellipsoidHeightM','7');await wait(30);check(Math.abs(manager.snapshot()[0].effectiveAlignment.ellipsoidHeightM-89)<1e-6,'terrain-relative numeric height preserves the absolute rendered position');
  await drag('east','touch');await wait(30);check(ref.value==='TERRAIN_RELATIVE'&&Math.abs(manager.snapshot()[0].effectiveAlignment.ellipsoidHeightM-89)<1e-6,'horizontal touch drag resamples terrain while preserving relative placement');
  ground=NaN;action('snap');await wait(30);check(panel().querySelector('[role="status"]').textContent.includes('Terrain unavailable')&&Math.abs(manager.snapshot()[0].effectiveAlignment.ellipsoidHeightM-89)<1e-6,'missing terrain is explicit and never becomes a zero-height placement');ground=82;
  let resolveGround;groundGate={promise:new Promise(resolve=>resolveGround=resolve)};action('snap');await wait(10);field('scale','1.15');await wait(10);resolveGround(200);groundGate=null;await wait(30);check(Math.abs(manager.snapshot()[0].effectiveAlignment.ellipsoidHeightM-89)<1e-6&&Math.abs(value('scale')-1.15)<1e-6,'obsolete terrain answers cannot replace a newer draft');
  await wait(40);viewer.render();action('source');await wait(20);check(viewer.entities.values.every(e=>e.show===false),'control-point picking hides gizmos and bounds so they cannot intercept pointer releases');viewer.render();const sourceCenter=screen(model.boundingSphere.center);
  const findModelPixel=(center,radius)=>FPVEditorPickFixture.findModelPixel(center,radius,(x,y)=>new C.Cartesian2(x,y),p=>viewer.scene.pick(p),model);
  const sourcePixel=await findModelPixel(sourceCenter,30);
  check(!!sourcePixel,'source control point is selectable on actual rendered geometry');
  let releasedPointers=0;const released=()=>releasedPointers++;canvas.addEventListener('pointerup',released);const tap=p=>{for(const name of ['pointerdown','pointerup'])canvas.dispatchEvent(new PointerEvent(name,{pointerId:14,pointerType:'touch',isPrimary:true,bubbles:true,cancelable:true,clientX:p.x,clientY:p.y,button:0,buttons:name==='pointerdown'?1:0}));};tap(sourcePixel);action('target');await wait(150);viewer.render();tap(sourcePixel);await wait(30);
  check(releasedPointers===2,'surface selection releases pointer events to Cesium camera controls');canvas.removeEventListener('pointerup',released);const pickedPair=JSON.parse(panel().querySelector('textarea').value)[0];check(pickedPair&&Number.isFinite(pickedPair.source.z)&&Number.isFinite(pickedPair.target.heightM),'source and target surface picking creates a geographic control pair: '+panel().querySelector('[role="status"]').textContent);
  const target={...pose,rotationDeg:31,pitchDeg:7,rollDeg:4,scale:1.25},pairs=[[0,0,0],[20,0,0],[0,20,0],[0,0,20]].map(([x,y,z])=>{const p=M.geographic(C,M.point(C,target,{x,y,z}));return {source:{x,y,z},target:{longitude:p.longitude,latitude:p.latitude,heightM:p.ellipsoidHeightM}};});
  panel().querySelector('textarea').value=JSON.stringify(pairs);action('fit');await wait(30);check(Math.abs(value('rotationDeg')-31)<1e-4&&Math.abs(value('pitchDeg')-7)<1e-4,'control-point fitting updates full 3D alignment');check(panel().querySelector('[data-residuals]').textContent.includes('RMS'),'control-point residual errors are visible');check(panel().querySelector('details').textContent.includes('Footprint:'),'model bounds, geographic footprint and origin are displayed');

  action('apply');await wait(10);saveWatchdog();check(panel().querySelector('[role="status"]').textContent.includes('acknowledgement missing'),'missing save acknowledgements leave a recoverable, explicit state');action('cancel');await wait(30);check(!editor.active&&C.Matrix4.equalsEpsilon(model.modelMatrix,matrix,1e-7)&&model.scale===1&&model.color.alpha===1,'cancel restores the exact model transform and appearance');check(C.Cartesian3.distance(viewer.camera.positionWC,camera)<1e-6,'cancel restores the original camera');check(viewer.entities.values.length===entities,'editor geometry is removed on close');check(loads===1,'numeric and graphical edits do not reload the model');
