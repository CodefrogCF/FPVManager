<!doctype html><html lang="en"><meta charset="utf-8"><title>FPVManager flight and shared input smoke</title>
<style>body{margin:0;background:#101820;color:#fff;font:14px system-ui}h1{font-size:19px;margin:12px}iframe{width:100%;height:62vh;border:0}pre{white-space:pre-wrap;padding:12px}</style>
<h1 id="status">Running flight and shared input smoke…</h1>
<iframe id="map" title="Actual Cesium with synthetic terrain"></iframe><pre id="log"></pre>
<script>
const frame=document.getElementById('map'),output=document.getElementById('log'),pending=new Map(),errors=[];
let session,next=0,flight,ground,terrain,recording,recordingAction;
const recorded=[];
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const check=(v,m)=>{if(!v)throw new Error(m);};
const log=m=>{output.textContent+='PASS: '+m+'\n';};
async function until(p,m,timeout=25000){const end=performance.now()+timeout;while(!p()){
  if(errors.length)throw new Error(errors.join('; '));if(performance.now()>end)throw new Error(m+' timeout');await pause(50);}}
window.addEventListener('message',event=>{
  if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
  let data;try{data=JSON.parse(event.data);}catch{return;}
  if(data.type==='globe-ready')session=data.sessionId;
  if(data.type==='terrain-status')terrain=data;
  if(data.type==='simulation-state')flight=data;
  if(data.type==='flight-recording-sample')recorded.push(data.sample);
  if(data.type==='flight-recording-state')recording=data;
  if(data.type==='flight-recording-action')recordingAction=data.action;
  if(data.type==='ground-view-state')ground=data;
  if(data.type==='globe-error')errors.push(data.message);
  if(data.type==='command-result'){
    const p=pending.get(data.requestId);if(!p)return;clearTimeout(p.timer);pending.delete(data.requestId);
    data.ok?p.resolve(data.result):p.reject(new Error(data.error));
  }
});
function command(type,fields={}){return new Promise((resolve,reject)=>{
  const requestId=String(++next),timer=setTimeout(()=>reject(new Error(type+' timeout')),25000);
  pending.set(requestId,{resolve,reject,timer});
  frame.contentWindow.postMessage(JSON.stringify({version:1,sessionId:session,requestId,type,...fields}),location.origin);
});}
(async()=>{
  const hudOnly=new URLSearchParams(location.search).has('hud');
  const recordingOnly=new URLSearchParams(location.search).has('recording');
  if(hudOnly||recordingOnly){frame.style.height='calc(100vh - 54px)';frame.style.display='block';output.hidden=true;
    document.getElementById('status').style.cssText='height:30px;margin:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';}
  frame.src='/terrain-globe.html'+(hudOnly||recordingOnly?'?chrome=floating':'');await until(()=>session&&terrain?.state==='ready','startup');
  const win=frame.contentWindow,doc=win.document,v=win.fixtureViewer,C=win.Cesium,canvas=v.canvas;
  v.camera.setView({destination:C.Cartesian3.fromDegrees(8.4,46.7,2000),orientation:{heading:0,pitch:-Math.PI/2,roll:0}});
  await until(()=>v.scene.globe.tilesLoaded,'terrain tiles');await pause(250);
  const original=v.camera.positionWC.clone(),near=v.camera.frustum.near;
  const originalGraphics={resolutionScale:v.resolutionScale,msaaSamples:v.scene.msaaSamples,tileCacheSize:v.scene.globe.tileCacheSize};
  await command('set-obstacle-vectors',{revision:1,features:[
    {id:'mast-a',category:'masts',parts:[{kind:'Point',elevated:true,heightAgl:50,coordinates:[[8.4,46.7,1200]]}]},
    {id:'mast-b',category:'masts',parts:[{kind:'Point',elevated:true,heightAgl:60,coordinates:[[8.401,46.701,1210]]}]},
    {id:'cable',category:'powerLines',parts:[{kind:'LineString',elevated:true,coordinates:[[8.4,46.7,1200],[8.401,46.701,1210]]}]}
  ]});
  const obstacles=v.dataSources.getByName('Swiss aviation obstacles')[0].entities.values;
  const mast=obstacles.find(e=>e.point),cable=obstacles.find(e=>e.polyline?.positions.getValue(v.clock.currentTime).length===2&&e.name);
  check(mast.position.isConstant&&cable.polyline.positions.isConstant,'Obstacle geometry is still dynamically evaluated');
  check(C.Cartesian3.distance(mast.position.getValue(v.clock.currentTime),cable.polyline.positions.getValue(v.clock.currentTime)[0])<.001,'Cable no longer lies on mast top');
  check(Math.abs(C.Cartographic.fromCartesian(mast.position.getValue(v.clock.currentTime)).height-1050)<.01,'Mast height changed');
  log('Actual Cesium uses constant mast/cable geometry and keeps cable endpoints on 50m AGL mast tops');
  await command('set-visible-routes',{revision:1,routes:[{id:42,name:'Inspection demo',waypoints:[
    {id:1,latitude:46.70005,longitude:8.4},{id:2,latitude:46.7003,longitude:8.4002}]}]});
  await command('enter-simulation',{latitude:46.7,longitude:8.4,agl:20,maxSpeed:15,climbSpeed:8,acceleration:15,deceleration:15});
  await until(()=>flight?.active,'flight entry');await pause(300);
  check(Math.abs(v.camera.positionCartographic.height-1020)<.5,'Configured spawn height');
  check(!doc.getElementById('navigation-hud').hidden&&!doc.getElementById('flight-buttons').hidden,'Flight controls absent');
  check(v.resolutionScale===.85&&v.scene.msaaSamples===2,'Default balanced graphics profile not applied');
  check(v.scene.globe.tileCacheSize===Math.max(512,originalGraphics.tileCacheSize),'Flight tile cache not increased');
  const graphics=doc.getElementById('flight-graphics-profile');
  graphics.value='performance';graphics.dispatchEvent(new win.Event('change',{bubbles:true}));
  check(v.resolutionScale===.75&&v.scene.msaaSamples===1,'Live performance graphics profile not applied');
  graphics.value='quality';graphics.dispatchEvent(new win.Event('change',{bubbles:true}));
  check(v.resolutionScale===1&&v.scene.msaaSamples===4,'Live quality graphics profile not applied');
  check(v.scene.globe.tileCacheSize===Math.max(512,originalGraphics.tileCacheSize),'Profile change altered the flight tile budget');
  log('All graphics profiles change actual Cesium resolution/MSAA without respawning');
  check(doc.getElementById('hud-mode').textContent.includes('SIM'),'HUD missing simulation label');
  check(/^\d+$/.test(doc.getElementById('hud-speed').textContent)&&doc.getElementById('flight-readout').textContent.includes('km/h'),'HUD missing labelled horizontal speed in km/h');
  check(doc.getElementById('hud-agl').textContent==='20.0'&&doc.getElementById('hud-height').textContent==='20.0','HUD confuses AGL and launch-ground height');
  const settingsButton=doc.getElementById('settings-flight'),settingsPanel=doc.getElementById('flight-options');
  check(settingsPanel.hidden,'HUD menu obscures the map by default');
  settingsButton.click();check(!settingsPanel.hidden&&settingsButton.getAttribute('aria-expanded')==='true','HUD menu not reachable');
  const hudSelect=doc.getElementById('flight-hud-style'),hud=doc.getElementById('navigation-hud');
  const coordinates=doc.getElementById('hud-coordinates'),coordinateToggle=doc.getElementById('flight-show-coordinates');
  check(coordinates.hidden&&!coordinateToggle.checked,'Coordinates should be opt-in');
  const coordinatePose=v.camera.positionWC.clone();coordinateToggle.checked=true;
  coordinateToggle.dispatchEvent(new win.Event('change',{bubbles:true}));
  await until(()=>flight.showCoordinates===true,'Coordinate visibility event');
  check(!coordinates.hidden&&coordinates.textContent==='46.70000, 8.40000','Coordinate readout does not match simulated WGS84 position');
  check(C.Cartesian3.distance(coordinatePose,v.camera.positionWC)<.001,'Coordinate toggle moved the drone');
  for(const style of ['betaflight','goggles']){
    const before=v.camera.positionWC.clone();hudSelect.value=style;hudSelect.dispatchEvent(new win.Event('change',{bubbles:true}));
    await until(()=>flight.hudStyle===style,'HUD style event');
    check(hud.dataset.style===style&&flight.hudStyle===style,'HUD style not synchronized');
    check(!coordinates.hidden&&coordinateToggle.checked,'HUD switch lost coordinate visibility');
    check(C.Cartesian3.distance(before,v.camera.positionWC)<.001,'HUD style respawned the drone');
  }
  settingsButton.click();check(settingsPanel.hidden,'HUD menu does not close');
  check(doc.elementFromPoint(win.innerWidth*.7,win.innerHeight*.45)===canvas,'Transparent HUD blocks flight input');
  log('Both HUD layouts retain height/distance values and switch without respawning; closed HUD controls leave map input reachable');
  coordinateToggle.checked=false;coordinateToggle.dispatchEvent(new win.Event('change',{bubbles:true}));
  await until(()=>flight.showCoordinates===false,'Coordinate disable event');check(coordinates.hidden,'Coordinates did not hide');
  log('Coordinates toggle in both actual HUD layouts without respawning and emit the next-flight setting');
  if(recordingOnly){
    const button=doc.getElementById('record-flight');canvas.focus();
    const pointer=new win.PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerType:'mouse'});button.dispatchEvent(pointer);
    check(pointer.defaultPrevented&&doc.activeElement===canvas,'Recording button blurred the active flight view');button.click();
    await until(()=>recordingAction==='start','Recording button request');
    const before=v.camera.positionWC.clone();await command('flight-recording-control',{action:'start',id:'recording-smoke'});
    await until(()=>recorded.length>=2,'Bounded recording samples');
    check(recorded[0][3]===46.7&&recorded[0][4]===8.4&&Math.abs(recorded[0][5]-1020)<.01&&Math.abs(recorded[0][6]-1000)<.01,'Recording changed coordinates or height reference');
    check(C.Cartesian3.distance(before,v.camera.positionWC)<.001,'Recording moved the drone');
    await command('flight-recording-control',{action:'pause',id:'recording-smoke'});
    const count=recorded.length;await pause(700);check(recorded.length===count,'Recording pause leaked samples');
    await command('flight-recording-control',{action:'resume',id:'recording-smoke'});
    await until(()=>recorded.length>count,'Recording resume');check(recorded.at(-1)[1]>recorded[0][1],'Recording gap was silently joined');
    await command('reset-simulation');await until(()=>recording?.phase==='stopped','Reset ends recording');
    check(button.title==='Review flight recording','Reset lost recording access');
    await command('flight-recording-control',{action:'restore',id:'retained',count:recorded.length});
    check(!doc.getElementById('review-recording').hidden,'Retained recording is unavailable');
    document.getElementById('status').textContent='PASS — bounded flight recording, pause, resume and reset retention';return;
  }
  if(hudOnly){coordinateToggle.checked=true;coordinateToggle.dispatchEvent(new win.Event('change',{bubbles:true}));
    await until(()=>!coordinates.hidden,'Coordinate preview');document.getElementById('status').textContent='PASS — compact optional HUD coordinates';return;}
  check(!v.scene.screenSpaceCameraController.enableInputs,'Orbital input active');
  log('Actual Cesium spawns at terrain +20m with FPV camera, HUD and an independent saved route overlay');
  if(new URLSearchParams(location.search).has('radio')){
    // Keep software-rendered input checks independent of GPU throughput.
    v.resolutionScale=.35;v.scene.msaaSamples=1;
    const axes=[0,0,-1,0],pad={connected:true,mapping:'',index:0,id:'Synthetic USB radio',axes,buttons:[]};
    let polling=true;
    Object.defineProperty(win.navigator,'getGamepads',{configurable:true,value:()=>polling?[pad]:[]});
    const renderFrame=()=>new Promise(resolve=>{
      const remove=v.scene.postRender.addEventListener(()=>{remove();resolve();});v.scene.requestRender();
    });
    const deviceEvent=type=>{
      const event=new win.Event(type);Object.defineProperty(event,'gamepad',{value:pad});win.dispatchEvent(event);
    };
    await command('enter-simulation',{latitude:46.7,longitude:8.4,agl:800,flightMode:'acro',controller:{layout:'radio',throttleZero:'bottom'}});
    canvas.focus();await until(()=>doc.getElementById('navigation-device').textContent==='Controller ready','Radio low-throttle activation');
    check(doc.getElementById('hud-throttle').textContent==='0','Radio bottom must be zero gas');
    axes[2]=0;await until(()=>doc.getElementById('hud-throttle').textContent==='50','Radio centre half gas');
    axes[2]=1;await until(()=>doc.getElementById('hud-throttle').textContent==='100','Radio full gas');
    const stallEnd=performance.now()+450;while(performance.now()<stallEnd){}
    deviceEvent('gamepadconnected');await renderFrame();
    check(doc.getElementById('navigation-device').textContent==='Controller ready','Render stall or delayed initial connection revoked radio activation');
    polling=false;await renderFrame();
    check(doc.getElementById('navigation-device').textContent.includes('input paused'),'Missing Web poll did not pause controller input');
    polling=true;await until(()=>doc.getElementById('navigation-device').textContent==='Controller ready','Web polling recovery without idle');
    await until(()=>doc.getElementById('hud-throttle').textContent==='100','Fresh Web throttle after recovery');
    check(doc.getElementById('controller-last-interruption').textContent.includes('temporarily unavailable'),'Last input interruption is not inspectable');
    log('Actual render loop retains radio activation after a blocked thread, delayed connection event and brief polling gap; fresh full throttle resumes without idle');
    settingsButton.focus();settingsButton.click();const zero=doc.getElementById('controller-zero');
    check(doc.getElementById('controller-last-interruption').textContent.includes('temporarily unavailable'),'Opening HUD settings hid the preceding data interruption');
    zero.value='center';zero.dispatchEvent(new win.Event('change',{bubbles:true}));
    await until(()=>flight.controller?.throttleZero==='center','Radio live zero update');
    settingsButton.click();await until(()=>doc.getElementById('hud-throttle').textContent==='0','Changed zero waits for idle');
    await until(()=>doc.getElementById('navigation-device').textContent.includes('Centre controller'),'Updated centre-zero activation prompt');
    axes[2]=0;await until(()=>doc.getElementById('navigation-device').textContent==='Controller ready','Radio centre activation');
    axes[2]=.6;await until(()=>doc.getElementById('hud-throttle').textContent==='60','Radio upper half gas');
    pad.connected=false;deviceEvent('gamepaddisconnected');await until(()=>doc.getElementById('hud-throttle').textContent==='0','Radio unplug clears gas');
    log('Unmapped USB radio drives actual Acro controls: bottom 0/50/100%, centre 0/60%, idle gate and unplug reset');
    await command('enter-simulation',{latitude:46.7,longitude:8.4,agl:800,flightMode:'acro',controller:{layout:'radio',throttleZero:'bottom'}});
    const native={connected:true,generation:42,axes:[0,0,-1,0],forward:0,right:0,yaw:0,pitch:0,vertical:0,reset:false,exit:false};
    const interval=setInterval(()=>command('navigation-input',native).catch(()=>{}),50);
    try{
      canvas.focus();await until(()=>doc.getElementById('navigation-device').textContent==='Controller ready','Native radio activation');
      native.axes[2]=0;await until(()=>doc.getElementById('hud-throttle').textContent==='50','Native radio midpoint');
      native.axes[2]=1;await until(()=>doc.getElementById('hud-throttle').textContent==='100','Native radio full gas');
      const gapStart=performance.now();
      native.stale=true;await command('navigation-input',native);await renderFrame();
      check(doc.getElementById('navigation-device').textContent.includes('input paused'),'Stale native data did not pause controller input');
      native.stale=false;native.axes[2]=0;await command('navigation-input',native);
      check(performance.now()-gapStart<750,'Native test gap exceeded the recovery window: '+(performance.now()-gapStart).toFixed(0)+' ms');
      await until(()=>doc.getElementById('navigation-device').textContent==='Controller ready','Fresh native recovery without idle');
      await until(()=>doc.getElementById('hud-throttle').textContent==='50','Fresh native throttle after recovery');
      log('Native transport recovers on current axes after a brief stale heartbeat without requiring bottom throttle');
      native.axes[2]=1;await until(()=>doc.getElementById('hud-throttle').textContent==='100','Native full throttle before replacement');
      native.generation++;await until(()=>doc.getElementById('hud-throttle').textContent==='0','Replacement radio requires idle');
      native.axes[2]=-1;await until(()=>doc.getElementById('navigation-device').textContent==='Controller ready','Replacement radio activation');
      native.axes[2]=1;await until(()=>doc.getElementById('hud-throttle').textContent==='100','Replacement radio full gas');
      native.connected=false;await until(()=>doc.getElementById('hud-throttle').textContent==='0','Native radio disconnect');
    }finally{clearInterval(interval);}
    await command('reset-simulation');await until(()=>flight.controller?.throttleZero==='bottom','Radio settings retained on reset');
    log('Android bridge-shaped radio frames reach actual Cesium flight; generation changes require idle and reset preserves settings');
    document.getElementById('status').textContent='PASS — USB radio and throttle zero smoke';return;
  }
  if(new URLSearchParams(location.search).has('hud')){
    await command('enter-simulation',{latitude:46.7,longitude:8.4,agl:30,flightMode:'angle',hudStyle:'betaflight'});
    settingsButton.click();const cameraButton=doc.getElementById('camera-flight'),cameraSlider=doc.getElementById('flight-camera-angle');
    cameraButton.click();check(!doc.getElementById('flight-camera').hidden,'Camera control not reachable in HUD settings');
    cameraSlider.value='25';cameraSlider.dispatchEvent(new win.Event('input',{bubbles:true}));
    await until(()=>flight.cameraTiltDegrees===25,'Live HUD camera adjustment');
    const up=v.scene.globe.ellipsoid.geodeticSurfaceNormal(v.camera.positionWC);
    check(C.Cartesian3.dot(v.camera.directionWC,up)>.4&&hud.dataset.style==='betaflight','Camera adjustment changed the HUD style or failed');
    settingsButton.click();check(settingsPanel.hidden,'HUD settings did not close after camera adjustment');
    log('Camera adjustment remains reachable from the compact HUD menu and changes the actual FPV view');
    await command('enter-simulation',{latitude:46.7,longitude:8.4,agl:30,flightMode:'gps',hudStyle:'betaflight'});
    canvas.focus();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'w',bubbles:true,cancelable:true}));
    await until(()=>Number(doc.getElementById('hud-distance').textContent.split(' ')[0])>=2,'Actual movement for home cue');
    canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'w',bubbles:true}));await pause(150);
    check(Number(doc.getElementById('hud-distance').textContent.split(' ')[0])>=1,'HUD home distance did not change');
    check(!doc.getElementById('hud-home-arrow').hidden&&doc.getElementById('hud-home-arrow').style.transform.includes('rotate('),'HUD home direction not displayed');
    await command('reset-simulation');await pause(150);
    check(hud.dataset.style==='betaflight'&&doc.getElementById('hud-height').textContent==='30.0','HUD style/launch height lost on reset');
    check(!doc.getElementById('hud-home-marker').hidden,'Home marker absent at spawn');
    log('Distance/home arrow follow actual flight; layout, home marker and launch-ground height survive reset');
    document.getElementById('status').textContent='PASS — flight HUD smoke';return;
  }
  if(new URLSearchParams(location.search).has('cache')){
    for(const flightMode of ['gps','acro','angle']){
      await command('enter-simulation',{latitude:46.7,longitude:8.4,agl:20,flightMode});
      await command('reset-simulation');
      check(v.scene.globe.tileCacheSize===Math.max(512,originalGraphics.tileCacheSize),'Mode/reset lost the flight cache budget');
    }
    await command('set-map-style',{style:'topographic'});
    check(v.scene.globe.tileCacheSize===Math.max(512,originalGraphics.tileCacheSize),'Map style change reset the flight cache budget');
    await command('exit-simulation');
    check(v.scene.globe.tileCacheSize===originalGraphics.tileCacheSize,'Exit did not restore the globe cache budget');
    await command('enter-ground-view',{latitude:46.7,longitude:8.4});
    check(v.scene.globe.tileCacheSize===originalGraphics.tileCacheSize,'Ground view inherited the flight cache budget');
    await command('exit-ground-view');
    log('Actual Cesium retains the flight tile budget across modes, reset and map style changes; exit restores it and ground view stays independent');
    document.getElementById('status').textContent='PASS — flight tile cache lifecycle';return;
  }
  canvas.focus();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'w',bubbles:true,cancelable:true}));
  canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'e',bubbles:true,cancelable:true}));
  const before=v.camera.positionWC.clone();
  try{
    await until(()=>C.Cartesian3.distance(before,v.camera.positionWC)>1&&v.camera.positionCartographic.height>1020.2,'Movement/climb');
  }finally{
    canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'w',bubbles:true}));
    canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'e',bubbles:true}));
  }
  check(C.Cartesian3.distance(before,v.camera.positionWC)>1&&v.camera.positionCartographic.height>1020.2,'Movement/climb failed');
  doc.getElementById('exit-flight').focus();const stopped=v.camera.positionWC.clone();await pause(250);
  check(C.Cartesian3.distance(stopped,v.camera.positionWC)<.05,'Focus loss did not brake');
  log('Keyboard movement and climb run in the real render loop; losing focus brakes the simulator');
  canvas.focus();const rect=canvas.getBoundingClientRect(),look=doc.getElementById('look-stick');
  const capture=canvas.setPointerCapture;canvas.setPointerCapture=()=>{};
  const point=(type,x,y)=>canvas.dispatchEvent(new win.PointerEvent(type,{pointerType:'touch',pointerId:12,button:0,
    clientX:rect.left+x,clientY:rect.top+y,bubbles:true,cancelable:true}));
  point('pointerdown',rect.width*.25,200);check(look.hidden,'Look stick appeared on left');
  point('pointerdown',rect.width*.75,200);check(!look.hidden,'Look stick did not appear on right');
  const bank=v.camera.roll;point('pointermove',rect.width*.75+35,180);await pause(350);
  point('pointercancel',rect.width*.75+35,180);canvas.setPointerCapture=capture;
  check(look.hidden&&Math.abs(v.camera.roll-bank)>.05,'Attitude stick did not bank or cancel');
  log('Right touch stick appears only on the right, banks the actual FPV camera and disappears on cancellation');
  let pads=[];Object.defineProperty(win.navigator,'getGamepads',{configurable:true,value:()=>pads});
  const pad=(y=0,rx=0)=>({connected:true,mapping:'standard',axes:[0,y,rx,0],buttons:Array.from({length:16},()=>({value:0}))});
  pads=[pad()];await pause(100);const beforePad=v.camera.positionWC.clone();pads=[pad(-1,.5)];await pause(500);
  check(C.Cartesian3.distance(beforePad,v.camera.positionWC)>.2,'Standard gamepad frame did not move camera');
  pads=[];win.dispatchEvent(new win.Event('gamepaddisconnected'));await pause(200);
  log('Standard Mode 2 gamepad fixture applies throttle and roll through the same render-loop controls');
  await command('reset-simulation');await pause(250);
  check(Math.abs(v.camera.positionCartographic.latitude-C.Math.toRadians(46.7))<1e-8&&
    Math.abs(v.camera.positionCartographic.height-1020)<.5,'Reset did not restore spawn');
  canvas.focus();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'q',bubbles:true,cancelable:true}));await pause(4000);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'q',bubbles:true}));
  check(v.camera.positionCartographic.height>=1000.49&&v.camera.positionCartographic.height<1002,'Terrain floor not respected');
  await command('exit-simulation');await until(()=>flight?.active===false,'exit');
  check(C.Cartesian3.distance(original,v.camera.positionWC)<.01&&v.camera.frustum.near===near,'Orbit snapshot not restored');
  check(v.resolutionScale===originalGraphics.resolutionScale&&v.scene.msaaSamples===originalGraphics.msaaSamples,'Orbital graphics settings not restored');
  check(v.scene.globe.tileCacheSize===originalGraphics.tileCacheSize,'Orbital tile cache not restored');
  log('Flight keeps a larger tile cache across graphics changes and restores the previous budget on exit');
  log('Reset restores configured spawn; descent stops above actual terrain; exit restores camera and frustum');
  await command('enter-ground-view',{latitude:46.7,longitude:8.4});await until(()=>ground?.active,'ground entry');
  check(doc.getElementById('flight-buttons').hidden&&doc.getElementById('navigation-hud').hidden,'Flight controls leaked into ground view');
  check(Math.abs(v.camera.positionCartographic.height-1002)<.5,'Ground eye height changed');
  await command('exit-ground-view');await until(()=>ground?.active===false,'ground exit');
  await until(()=>{
    const ray=v.camera.getPickRay(new C.Cartesian2(canvas.clientWidth/2,canvas.clientHeight/2));
    return ray&&v.scene.globe.pick(ray,v.scene);
  },'Restored camera target terrain');
  await command('enter-simulation',{agl:5});await until(()=>flight?.active,'camera-target entry');
  check(Math.abs(v.camera.positionCartographic.height-1005)<.5,'Camera target spawn failed');
  await command('enter-simulation',{agl:400,flightMode:'acro'});await pause(100);
  const cameraButton=doc.getElementById('camera-flight'),cameraSlider=doc.getElementById('flight-camera-angle');
  settingsButton.click();check(!settingsPanel.hidden,'HUD camera settings not reachable');
  cameraButton.click();check(!doc.getElementById('flight-camera').hidden,'Camera adjustment did not open');
  cameraSlider.value='30';cameraSlider.dispatchEvent(new win.Event('input',{bubbles:true}));
  const tiltUp=v.scene.globe.ellipsoid.geodeticSurfaceNormal(v.camera.positionWC);
  check(C.Cartesian3.dot(v.camera.directionWC,tiltUp)>.49,'Camera did not tilt upward relative to the drone');
  check(doc.getElementById('flight-camera-value').textContent==='30°','Camera angle label not updated');
  cameraSlider.value='0';cameraSlider.dispatchEvent(new win.Event('input',{bubbles:true}));
  settingsButton.click();check(settingsPanel.hidden,'HUD camera settings did not close');
  log('FPV camera tilt changes the actual Cesium view in flight without respawning');
  canvas.focus();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));await pause(1100);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));
  const localUp=v.scene.globe.ellipsoid.geodeticSurfaceNormal(v.camera.positionWC);
  check(C.Cartesian3.dot(v.camera.upWC,localUp)<-.8,'Acro camera did not roll through inverted flight');
  await pause(1000);const held=v.camera.upWC.clone();await pause(250);
  check(C.Cartesian3.dot(held,v.camera.upWC)>.999,'Acro automatically leveled after release');
  const coastStart=v.camera.positionCartographic.height;await pause(200);
  const coastSpeed=(coastStart-v.camera.positionCartographic.height)/.2;
  const thrustStart=v.camera.positionCartographic.height;
  canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'e',bubbles:true,cancelable:true}));await pause(400);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'e',bubbles:true}));
  const thrustSpeed=(thrustStart-v.camera.positionCartographic.height)/.4;
  check(thrustSpeed>coastSpeed+3,'Inverted full throttle did not increase downward speed');
  const fallStart=v.camera.positionCartographic.height;
  canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'q',bubbles:true,cancelable:true}));await pause(300);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'q',bubbles:true}));
  check(fallStart-v.camera.positionCartographic.height>3,'Throttle cut failed to continue the fall');
  check(doc.getElementById('hud-vertical').textContent.startsWith('-'),'Signed vertical speed missing from Acro HUD');
  log('Inverted full throttle accelerates the actual camera toward terrain; throttle cut preserves a gravity/drag fall beyond assisted descent limits');
  await command('enter-simulation',{latitude:46.7,longitude:8.4,agl:400,flightMode:'acro',
    acroRollRate:90,acroPitchRate:420,acroYawRate:250,acroRateExpo:.4});
  async function customRoll(){
    canvas.focus();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));
    await pause(1100);canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));await pause(700);
    const up=v.scene.globe.ellipsoid.geodeticSurfaceNormal(v.camera.positionWC);
    return C.Cartesian3.dot(v.camera.upWC,up);
  }
  const slowRoll=await customRoll();
  check(slowRoll>-.7&&slowRoll<.3,'Configured 90 deg/s roll did not reach the actual camera');
  await command('reset-simulation');
  const resetRoll=await customRoll();
  check(Math.abs(resetRoll-slowRoll)<.2,'Reset lost the configured body rate');
  log('Configured 90 deg/s Acro roll affects the actual Cesium camera and survives reset; the HUD labels horizontal speed in km/h');
  await command('enter-simulation',{agl:30,flightMode:'gps'});await pause(100);
  check(Math.abs(v.camera.positionCartographic.height-1030)<.5,'Mode switch did not respawn');
  canvas.focus();const gpsStart=v.camera.positionWC.clone();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'w',bubbles:true,cancelable:true}));await pause(600);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'w',bubbles:true}));
  check(C.Cartesian3.distance(gpsStart,v.camera.positionWC)>.2&&Math.abs(v.camera.positionCartographic.height-1030)<.5,'GPS movement/height hold changed');
  await command('exit-simulation');
  log('Ground view retains its 2m eye height; camera-target spawn, Acro inverted attitude/hold and GPS translation/height hold work');
  document.getElementById('status').textContent='PASS — flight and shared input smoke';
})().catch(error=>{document.getElementById('status').textContent='FAIL: '+error.message;output.textContent+=String(error.stack||error);});
</script></html>
