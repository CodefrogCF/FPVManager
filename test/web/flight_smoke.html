<!doctype html><html lang="en"><meta charset="utf-8"><title>FPVManager flight and shared input smoke</title>
<style>body{margin:0;background:#101820;color:#fff;font:14px system-ui}h1{font-size:19px;margin:12px}iframe{width:100%;height:62vh;border:0}pre{white-space:pre-wrap;padding:12px}</style>
<h1 id="status">Running flight and shared input smoke…</h1>
<iframe id="map" title="Actual Cesium with synthetic terrain"></iframe><pre id="log"></pre>
<script>
const frame=document.getElementById('map'),output=document.getElementById('log'),pending=new Map(),errors=[];
let session,next=0,flight,ground,terrain;
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const check=(v,m)=>{if(!v)throw new Error(m);};
const log=m=>{output.textContent+='PASS: '+m+'\n';};
async function until(p,m,timeout=25000){const end=performance.now()+timeout;while(!p()){
  if(errors.length)throw new Error(errors.join('; '));if(performance.now()>end)throw new Error(m+' timeout');await pause(50);}}
window.addEventListener('message',event=>{
  if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
  let data;try{data=JSON.parse(event.data);}catch{return;}
  if(data.type==='globe-ready')session=data.sessionId;
  if(data.type==='terrain-status')terrain=data;
  if(data.type==='simulation-state')flight=data;
  if(data.type==='ground-view-state')ground=data;
  if(data.type==='globe-error')errors.push(data.message);
  if(data.type==='command-result'){
    const p=pending.get(data.requestId);if(!p)return;clearTimeout(p.timer);pending.delete(data.requestId);
    data.ok?p.resolve(data.result):p.reject(new Error(data.error));
  }
});
function command(type,fields={}){return new Promise((resolve,reject)=>{
  const requestId=String(++next),timer=setTimeout(()=>reject(new Error(type+' timeout')),25000);
  pending.set(requestId,{resolve,reject,timer});
  frame.contentWindow.postMessage(JSON.stringify({version:1,sessionId:session,requestId,type,...fields}),location.origin);
});}
(async()=>{
  frame.src='/terrain-globe.html';await until(()=>session&&terrain?.state==='ready','startup');
  const win=frame.contentWindow,doc=win.document,v=win.fixtureViewer,C=win.Cesium,canvas=v.canvas;
  v.camera.setView({destination:C.Cartesian3.fromDegrees(8.4,46.7,2000),orientation:{heading:0,pitch:-Math.PI/2,roll:0}});
  await until(()=>v.scene.globe.tilesLoaded,'terrain tiles');await pause(250);
  const original=v.camera.positionWC.clone(),near=v.camera.frustum.near;
  await command('set-visible-routes',{revision:1,routes:[{id:42,name:'Inspection demo',waypoints:[
    {id:1,latitude:46.70005,longitude:8.4},{id:2,latitude:46.7003,longitude:8.4002}]}]});
  await command('enter-simulation',{latitude:46.7,longitude:8.4,agl:20,maxSpeed:15,climbSpeed:8,acceleration:15,deceleration:15});
  await until(()=>flight?.active,'flight entry');await pause(300);
  check(Math.abs(v.camera.positionCartographic.height-1020)<.5,'Configured spawn height');
  check(!doc.getElementById('navigation-hud').hidden&&!doc.getElementById('flight-buttons').hidden,'Flight controls absent');
  check(doc.getElementById('flight-readout').textContent.includes('SIMULATION'),'HUD missing simulation label');
  check(!v.scene.screenSpaceCameraController.enableInputs,'Orbital input active');
  log('Actual Cesium spawns at terrain +20m with FPV camera, HUD and an independent saved route overlay');
  canvas.focus();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'w',bubbles:true,cancelable:true}));
  canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'e',bubbles:true,cancelable:true}));
  const before=v.camera.positionWC.clone();await pause(850);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'w',bubbles:true}));
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'e',bubbles:true}));
  check(C.Cartesian3.distance(before,v.camera.positionWC)>1&&v.camera.positionCartographic.height>1020.2,'Movement/climb failed');
  doc.getElementById('exit-flight').focus();const stopped=v.camera.positionWC.clone();await pause(250);
  check(C.Cartesian3.distance(stopped,v.camera.positionWC)<.05,'Focus loss did not brake');
  log('Keyboard movement and climb run in the real render loop; losing focus brakes the simulator');
  canvas.focus();const rect=canvas.getBoundingClientRect(),look=doc.getElementById('look-stick');
  const capture=canvas.setPointerCapture;canvas.setPointerCapture=()=>{};
  const point=(type,x,y)=>canvas.dispatchEvent(new win.PointerEvent(type,{pointerType:'touch',pointerId:12,button:0,
    clientX:rect.left+x,clientY:rect.top+y,bubbles:true,cancelable:true}));
  point('pointerdown',rect.width*.25,200);check(look.hidden,'Look stick appeared on left');
  point('pointerdown',rect.width*.75,200);check(!look.hidden,'Look stick did not appear on right');
  const bank=v.camera.roll;point('pointermove',rect.width*.75+35,180);await pause(350);
  point('pointercancel',rect.width*.75+35,180);canvas.setPointerCapture=capture;
  check(look.hidden&&Math.abs(v.camera.roll-bank)>.05,'Attitude stick did not bank or cancel');
  log('Right touch stick appears only on the right, banks the actual FPV camera and disappears on cancellation');
  let pads=[];Object.defineProperty(win.navigator,'getGamepads',{configurable:true,value:()=>pads});
  const pad=(y=0,rx=0)=>({connected:true,mapping:'standard',axes:[0,y,rx,0],buttons:Array.from({length:16},()=>({value:0}))});
  pads=[pad()];await pause(100);const beforePad=v.camera.positionWC.clone();pads=[pad(-1,.5)];await pause(500);
  check(C.Cartesian3.distance(beforePad,v.camera.positionWC)>.2,'Standard gamepad frame did not move camera');
  pads=[];win.dispatchEvent(new win.Event('gamepaddisconnected'));await pause(200);
  log('Standard Mode 2 gamepad fixture applies throttle and roll through the same render-loop controls');
  await command('reset-simulation');await pause(250);
  check(Math.abs(v.camera.positionCartographic.latitude-C.Math.toRadians(46.7))<1e-8&&
    Math.abs(v.camera.positionCartographic.height-1020)<.5,'Reset did not restore spawn');
  canvas.focus();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'q',bubbles:true,cancelable:true}));await pause(4000);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'q',bubbles:true}));
  check(v.camera.positionCartographic.height>=1000.49&&v.camera.positionCartographic.height<1002,'Terrain floor not respected');
  await command('exit-simulation');await until(()=>flight?.active===false,'exit');
  check(C.Cartesian3.distance(original,v.camera.positionWC)<.01&&v.camera.frustum.near===near,'Orbit snapshot not restored');
  log('Reset restores configured spawn; descent stops above actual terrain; exit restores camera and frustum');
  await command('enter-ground-view',{latitude:46.7,longitude:8.4});await until(()=>ground?.active,'ground entry');
  check(doc.getElementById('flight-buttons').hidden&&doc.getElementById('navigation-hud').hidden,'Flight controls leaked into ground view');
  check(Math.abs(v.camera.positionCartographic.height-1002)<.5,'Ground eye height changed');
  await command('exit-ground-view');await until(()=>ground?.active===false,'ground exit');
  await command('enter-simulation',{agl:5});await until(()=>flight?.active,'camera-target entry');
  check(Math.abs(v.camera.positionCartographic.height-1005)<.5,'Camera target spawn failed');
  await command('enter-simulation',{agl:400,flightMode:'acro'});await pause(100);
  const cameraButton=doc.getElementById('camera-flight'),cameraSlider=doc.getElementById('flight-camera-angle');
  cameraButton.click();check(!doc.getElementById('flight-camera').hidden,'Camera adjustment did not open');
  cameraSlider.value='30';cameraSlider.dispatchEvent(new win.Event('input',{bubbles:true}));
  const tiltUp=v.scene.globe.ellipsoid.geodeticSurfaceNormal(v.camera.positionWC);
  check(C.Cartesian3.dot(v.camera.directionWC,tiltUp)>.49,'Camera did not tilt upward relative to the drone');
  check(doc.getElementById('flight-camera-value').textContent==='30°','Camera angle label not updated');
  cameraSlider.value='0';cameraSlider.dispatchEvent(new win.Event('input',{bubbles:true}));
  log('FPV camera tilt changes the actual Cesium view in flight without respawning');
  canvas.focus();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));await pause(1100);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));
  const localUp=v.scene.globe.ellipsoid.geodeticSurfaceNormal(v.camera.positionWC);
  check(C.Cartesian3.dot(v.camera.upWC,localUp)<-.8,'Acro camera did not roll through inverted flight');
  await pause(1000);const held=v.camera.upWC.clone();await pause(250);
  check(C.Cartesian3.dot(held,v.camera.upWC)>.999,'Acro automatically leveled after release');
  const coastStart=v.camera.positionCartographic.height;await pause(200);
  const coastSpeed=(coastStart-v.camera.positionCartographic.height)/.2;
  const thrustStart=v.camera.positionCartographic.height;
  canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'e',bubbles:true,cancelable:true}));await pause(400);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'e',bubbles:true}));
  const thrustSpeed=(thrustStart-v.camera.positionCartographic.height)/.4;
  check(thrustSpeed>coastSpeed+3,'Inverted full throttle did not increase downward speed');
  const fallStart=v.camera.positionCartographic.height;
  canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'q',bubbles:true,cancelable:true}));await pause(300);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'q',bubbles:true}));
  check(fallStart-v.camera.positionCartographic.height>3,'Throttle cut failed to continue the fall');
  check(doc.getElementById('flight-readout').textContent.includes('V -'),'Signed vertical speed missing from Acro HUD');
  log('Inverted full throttle accelerates the actual camera toward terrain; throttle cut preserves a gravity/drag fall beyond assisted descent limits');
  await command('enter-simulation',{agl:30,flightMode:'gps'});await pause(100);
  check(Math.abs(v.camera.positionCartographic.height-1030)<.5,'Mode switch did not respawn');
  canvas.focus();const gpsStart=v.camera.positionWC.clone();canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:'w',bubbles:true,cancelable:true}));await pause(600);
  canvas.dispatchEvent(new win.KeyboardEvent('keyup',{key:'w',bubbles:true}));
  check(C.Cartesian3.distance(gpsStart,v.camera.positionWC)>.2&&Math.abs(v.camera.positionCartographic.height-1030)<.5,'GPS movement/height hold changed');
  await command('exit-simulation');
  log('Ground view retains its 2m eye height; camera-target spawn, Acro inverted attitude/hold and GPS translation/height hold work');
  document.getElementById('status').textContent='PASS — flight and shared input smoke';
})().catch(error=>{document.getElementById('status').textContent='FAIL: '+error.message;output.textContent+=String(error.stack||error);});
</script></html>
