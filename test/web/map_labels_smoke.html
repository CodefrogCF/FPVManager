<!doctype html><html lang="de"><meta charset="utf-8"><title>Labels on imagery smoke</title>
<style>body{margin:0;background:#101820;color:white;font:14px system-ui}h1{font-size:15px;margin:6px}iframe{width:100%;height:75vh;border:0}pre{white-space:pre-wrap;font-size:11px;margin:8px}</style>
<h1 id="status">Running label smoke…</h1><iframe id="map" title="Cesium labels"></iframe><pre id="log"></pre>
<script>
const frame=document.getElementById('map'),pending=new Map(),errors=[];let session,next=0,ready,labelState;
const pause=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,m)=>{if(!v)throw Error(m);},log=m=>document.getElementById('log').textContent+='PASS: '+m+'\n';
async function until(predicate,message){const end=performance.now()+35000;while(!predicate()){if(errors.length)throw Error(errors.join('; '));if(performance.now()>end)throw Error(message+' timeout');await pause(50);}}
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;let value;try{value=JSON.parse(event.data);}catch{return;}
 if(value.type==='globe-ready')session=value.sessionId;if(value.type==='terrain-status')ready=value.state==='ready';if(value.type==='labels-layer-status')labelState=value.state;
 if(value.type==='globe-error')errors.push(value.message);if(value.type==='command-result'){const p=pending.get(value.requestId);if(p){pending.delete(value.requestId);clearTimeout(p.timer);value.ok?p.resolve(value.result):p.reject(Error(value.error));}}});
function command(type,fields={}){return new Promise((resolve,reject)=>{const requestId=String(++next),timer=setTimeout(()=>reject(Error(type+' timeout')),35000);pending.set(requestId,{resolve,reject,timer});frame.contentWindow.postMessage(JSON.stringify({version:1,sessionId:session,requestId,type,...fields}),location.origin);});}
(async()=>{
 const parameters=new URLSearchParams(location.search);frame.src='/labels-globe.html?'+parameters;await until(()=>session&&ready,'terrain');
 const win=frame.contentWindow,v=win.fixtureViewer,C=win.Cesium;v.resolutionScale=.65;
 v.camera.setView({destination:C.Cartesian3.fromDegrees(7.442,46.95,2500),orientation:{heading:0,pitch:-Math.PI/2,roll:0}});
 await until(()=>v.scene.globe.tilesLoaded,'terrain mesh');
 const labels=()=>Array.from({length:v.scene.primitives.length},(_,i)=>v.scene.primitives.get(i)).filter(p=>p instanceof C.LabelCollection);
 await command('set-map-labels',{visible:true});await until(()=>['ready','partial'].includes(labelState)&&labels()[0]?.length>0,'visible names');
 const collection=labels()[0],visible=()=>Array.from({length:collection.length},(_,i)=>collection.get(i)).filter(l=>l.show);
 await until(()=>visible().length>0,'decluttered names');check(visible().length<=80,'Unbounded labels');
 log('Actual Cesium displays outlined, terrain-clamped names without an opaque map or extra road layer');
 const calls=win.fixtureLabelCalls;v.camera.moveRight(25);await pause(850);check(collection.show&&visible().length>0,'Panning hid the layer');
 await command('set-map-style',{style:'topographic'});await command('set-map-style',{style:'satellite'});await pause(300);
 check(labels().length===1&&labels()[0]===collection,'Style change duplicated or removed labels');
 log('Panning and repeated style changes preserve one label layer and its requested visibility');
 win.fixtureLabelsFail=true;await command('set-map-labels',{visible:true,retry:true});await until(()=>labelState==='failed','nonblocking refresh failure');
 check(collection.show&&visible().length>0,'Failure discarded previous names');win.fixtureLabelsFail=false;
 await command('set-map-labels',{visible:true,retry:true});await until(()=>['ready','partial'].includes(labelState),'recovery');
 await command('set-map-labels',{visible:false});check(!collection.show,'Disable failed');await command('set-map-labels',{visible:true});await until(()=>collection.show,'restore');
 check(errors.length===0,'Generic globe initialization error');
 log('Refresh failures retain visible names; retry and toggle recover without a globe error');
 document.getElementById('status').textContent='PASS — labels, imagery and renderer lifecycle';
})().catch(error=>{document.getElementById('status').textContent='FAIL: '+error.message;document.getElementById('log').textContent+=error.stack;});
</script></html>
