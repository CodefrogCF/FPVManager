<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Live radio browser runtime regression</title>
<body data-status="running">
<button id="hud-live-radio"></button><input id="flight-radio-enabled" type="checkbox">
<span id="flight-radio-status"></span><button id="configure-flight-radio"></button>
<pre id="result">Running</pre>
<script src="../../web/cesium/Cesium.js"></script>
<script src="../../web/core/globe_bridge.js"></script>
<script src="../../web/features/terrain/terrain_service.js"></script>
<script src="../../web/features/signal/rf_estimation.js"></script>
<script src="../../web/features/signal/live_terrain_tile_cache.js"></script>
<script src="../../web/features/signal/live_radio.js"></script>
<script>
(async () => {
    const result = document.getElementById('result'), checks = [];
    let live, terrain, bridge, tileRequests = 0, fallbackCalls = 0, sequence = 0;
    const pending = new Map(), C = Cesium;
    const check = (ok, message) => { if (!ok) throw Error(message); checks.push(message); };
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    try {
        // Ensure this is a real Window host runtime, unlike the old Node mocks.
        let rejectsReceiver = false;
        try { const raw = { setTimeout }; raw.setTimeout(() => {}, 0); }
        catch (error) { rejectsReceiver = error instanceof TypeError && /Illegal invocation/i.test(error.message); }
        check(rejectsReceiver, 'Native Window timer rejects a plain-object receiver');
        const scheme = new C.GeographicTilingScheme();
        const provider = {
            availability: { computeMaximumLevelAtPosition: () => 17 },
            tilingScheme: scheme, errorEvent: new C.Event(),
            requestTileGeometry() {
                ++tileRequests;
                return wait(2).then(() => ({ interpolateHeight: () => 500 }));
            },
        };
        terrain = FPVTerrain.createTerrainManager({
            createProvider: async () => provider,
            createFallback: () => new C.EllipsoidTerrainProvider(),
            applyProvider() {}, onStatus() {}, probe: async () => {},
        });
        await terrain.initialize();
        check(terrain.status().state === 'ready', 'Actual terrain manager is ready');
        live = FPVLiveRadio.create({ C, viewer: {}, terrain,
            ready: () => terrain.status().state === 'ready', emit() {}, doc: document,
            layer: { set() {}, clear() {}, dispose() {} } });
        bridge = FPVGlobeBridge.createBridge({ sessionId: 'runtime-regression',
            send(raw) {
                const event = JSON.parse(raw);
                if (event.type !== 'command-result') return;
                const request = pending.get(event.requestId);
                if (!request) return;
                pending.delete(event.requestId);
                event.ok ? request.resolve(event.result) : request.reject(Error(event.error));
            },
            execute(command, signal) {
                switch (command.type) {
                    case 'set-flight-radio-monitor': return live.monitor(command);
                    case 'query-live-radio-terrain': return live.sample(command, signal);
                    case 'set-live-radio-result': return live.set(command);
                    default: throw Error('Unexpected runtime command');
                }
            },
        });
        const command = (type, data) => new Promise((resolve, reject) => {
            const requestId = String(++sequence);
            pending.set(requestId, { resolve, reject });
            bridge.receive(JSON.stringify({ ...data, type, requestId, version: 1,
                sessionId: 'runtime-regression' }));
        });
        await command('set-flight-radio-monitor', { enabled: true, revision: 1 });
        live.observe({ active: true, paused: false, flightId: 1,
            position: { latitude: 47, longitude: 8.00075 },
            height: 600, speed: 0, home: { latitude: 47, longitude: 8 } });
        for (const count of [13, 25]) {
            const positions = Array.from({ length: count }, (_, i) => ({
                latitude: 47, longitude: 8 + .0015 * i / (count - 1) }));
            const sampled = await command('query-live-radio-terrain', {
                generation: 6, analysisRequestId: count, positions });
            check(sampled.heights.length === count && sampled.heights.every(h => h === 500),
                `${count} exact terrain samples cross the JSON bridge`);
            check(sampled.diagnostics.active === 0 && sampled.diagnostics.errorCategory === null,
                `${count}-point request releases its slot without a sampling error`);
        }
        const requestsBefore = tileRequests;
        await command('query-live-radio-terrain', { generation: 6, analysisRequestId: 26,
            positions: [{ latitude: 47, longitude: 8.00015 }] });
        check(tileRequests === requestsBefore, 'A new coordinate reuses detailed tile data');
        await command('set-live-radio-result', { revision: 2, flightId: 1,
            state: 'noSampledObstruction', expiresAtMs: Date.now() + 5000,
            observation: { quality: 'valid', ageMs: 0 },
            assessment: { visibility: 'clear', source: 'sampledTerrain', confidence: 'approximate',
                controlLink: { quality: .9, source: 'rfModel' }, videoLink: 'unknown' },
            rays: [{ latitude: 47, longitude: 8.00075, height: 600,
                state: 'noSampledObstruction' }] });
        check(live.assessment().observation.quality === 'valid' &&
            live.assessment().controlLink.quality === .9, 'Valid RF observation reaches the consumer');
        // Test the tile-cache defaults independently: the adapter normally
        // injects its timer facade, which used to hide this second defect.
        const cache = FPVLiveTerrainTileCache.create({ C: { sampleTerrainMostDetailed: async (_, points) => {
            ++fallbackCalls; return points.map(p => ({ ...p, height: 999 })); } } });
        try {
            const sampled = await cache.sample(provider, [C.Cartographic.fromDegrees(8.0002, 47)],
                new AbortController().signal);
            check(sampled[0].height === 500 && fallbackCalls === 0,
                'Standalone tile cache uses native host timers without fallback');
        } finally { cache.reset(); }
        document.body.dataset.status = 'pass';
        result.textContent = JSON.stringify({ status: 'pass', checks, tileRequests,
            fallbackCalls, browser: navigator.userAgent });
    } catch (error) {
        document.body.dataset.status = 'fail';
        result.textContent = JSON.stringify({ status: 'fail', error: error.message,
            checks, tileRequests, browser: navigator.userAgent });
    } finally {
        live?.dispose(); terrain?.dispose(); bridge?.dispose();
    }
})();
</script>
</body></html>
