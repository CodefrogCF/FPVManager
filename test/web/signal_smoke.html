<!doctype html><html lang="en"><meta charset="utf-8"><title>FPVManager radio path and Fresnel smoke</title>
<style>body{margin:0;background:#101820;color:#fff;font:14px system-ui}h1{font-size:19px;margin:12px}iframe{width:100%;height:62vh;border:0}pre{white-space:pre-wrap;padding:12px}</style>
<h1 id="status">Running radio path and Fresnel smoke…</h1>
<iframe id="map" title="Actual Cesium with synthetic terrain"></iframe><pre id="log"></pre>
<script>
const frame=document.getElementById('map'), output=document.getElementById('log');
let session, next=0, ground, terrain;
const pending=new Map(), actions=[], errors=[];
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function check(value,message) { if(!value) throw new Error(message); }
function log(message) { output.textContent+='PASS: '+message+'\n'; }
async function until(predicate,message,timeout=25000) {
  const end=performance.now()+timeout;
  while(!predicate()) { if(errors.length) throw new Error(errors.join('; ')); if(performance.now()>end) throw new Error(message+' timeout'); await pause(50); }
}
window.addEventListener('message',event=>{
  if(event.source!==frame.contentWindow || event.origin!==location.origin) return;
  let data; try {data=JSON.parse(event.data);} catch {return;}
  if(data.type==='globe-ready') session=data.sessionId;
  if(data.type==='terrain-status') terrain=data;
  if(data.type==='ground-view-state') ground=data;
  if(data.type==='route-map-action') actions.push(data);
  if(data.type==='globe-error') errors.push(data.message);
  if(data.type==='command-result') {
    const item=pending.get(data.requestId); if(!item) return;
    clearTimeout(item.timer); pending.delete(data.requestId);
    data.ok?item.resolve(data.result):item.reject(new Error(data.error));
  }
});
function command(type,fields={}) { return new Promise((resolve,reject)=>{
  const requestId=String(++next),timer=setTimeout(()=>{pending.delete(requestId);reject(new Error(type+' timeout'));},25000);
  pending.set(requestId,{resolve,reject,timer});
  frame.contentWindow.postMessage(JSON.stringify({version:1,sessionId:session,requestId,type,...fields}),location.origin);
}); }
(async()=>{
  frame.src='/terrain-globe.html'; await until(()=>session && terrain?.state==='ready','terrain startup');
  const win=frame.contentWindow, viewer=win.fixtureViewer, C=win.Cesium;
  viewer.camera.setView({destination:C.Cartesian3.fromDegrees(8.4,46.7,2000),orientation:{heading:0,pitch:-Math.PI/2,roll:0}});
  const source=()=>Array.from({length:viewer.dataSources.length},(_,i)=>viewer.dataSources.get(i)).find(s=>s.name==='Geometric radio analysis');
  const state={pilot:{latitude:46.7,longitude:8.4,height:1002},frequencyMhz:5800,fraction:.6,selected:0,rays:[
    {latitude:46.7005,longitude:8.405,height:1050,ground:1000,state:'fresnelIntrusion'},
    {latitude:46.701,longitude:8.405,height:null,ground:1000,state:'unknown'}]};
  await command('set-signal-analysis',state);
  check(source(),'Signal data source missing');
  const time=viewer.clock.currentTime, entities=source().entities;
  const pilot=entities.getById('signal-pilot').position.getValue(time), target=entities.getById('signal-target-0').position.getValue(time);
  check(Math.abs(C.Cartographic.fromCartesian(pilot).height-1002)<.01,'Pilot antenna height changed');
  check(Math.abs(C.Cartographic.fromCartesian(target).height-1050)<.01,'Known drone height changed');
  check(!entities.getById('signal-ray-1'),'Unknown height produced a radio ray');
  const positions=entities.getById('signal-envelope-0').polyline.positions.getValue(time), mid=C.Cartesian3.lerp(pilot,target,.5,new C.Cartesian3());
  const radius=Math.sqrt(299792458/(5800*1e6)*C.Cartesian3.distance(pilot,target)/4)*.6;
  check(positions.length===65 && Math.abs(C.Cartesian3.distance(positions[32],mid)-radius)<1e-6,'Fresnel wireframe radius mismatch');
  check(entities.getById('signal-ray-0').polyline.arcType.getValue(time)===C.ArcType.NONE,'Radio line follows the globe instead of the straight chord');
  log('Actual Cesium preserves antenna/drone heights, omits unknown rays and renders the configured 3D Fresnel radius');
  await command('enter-ground-view',{latitude:46.7,longitude:8.4}); await until(()=>ground?.active,'ground entry');
  await command('set-signal-analysis',{...state,selected:1});
  check(ground.active,'Radio overlay interrupted ground inspection');
  log('Signal overlay changes preserve first-person inspection');
  await command('exit-ground-view');
  win.postMessage({fixtureOffline:true},location.origin);
  await until(()=>terrain?.state==='offline','terrain failure');
  check(!source(),'Stale radio paths survived terrain loss');
  log('Terrain loss removes the analysis overlay');
  win.postMessage({fixtureOffline:false},location.origin); await command('retry-terrain');
  await until(()=>terrain?.state==='ready','terrain recovery');
  check(!source(),'Recovery replayed stale analysis without recalculation');
  await command('set-signal-analysis',state); await command('set-signal-analysis',{rays:[]}); check(!source(),'Explicit cleanup failed');
  log('Recovery requires recalculation; explicit overlay cleanup releases the data source');
  await command('set-signal-analysis',state);
  viewer.camera.lookAt(C.Cartesian3.fromDegrees(8.4025,46.70025,1025),new C.HeadingPitchRange(0,-.5,380));
  document.getElementById('status').textContent='PASS — radio paths and Fresnel envelope';
})().catch(error=>{document.getElementById('status').textContent='FAIL: '+error.message;output.textContent+=String(error.stack||error);});
</script></html>
