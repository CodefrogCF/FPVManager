<!doctype html><html lang="en"><meta charset="utf-8"><title>Bridge to sloping tunnel portal regression</title>
<link rel="stylesheet" href="/cesium/Widgets/widgets.css">
<style>body{margin:0;background:#101820;color:white;font:15px system-ui}h1{font-size:19px;margin:12px}#viewer{height:480px;width:960px;max-width:100%}pre{padding:12px;white-space:pre-wrap}</style>
<h1 id="status">Checking a low bridge approach into a descending tunnel…</h1><div id="viewer"></div><pre id="log"></pre>
<script>window.CESIUM_BASE_URL='/cesium/';</script><script src="/cesium/Cesium.js"></script>
<script src="/scene_environment.js"></script><script src="/controller_input.js"></script>
<script src="/free_flight.js"></script><script src="/flight_rendering.js"></script>
<script>
'use strict';
const C=Cesium,T=FPVTunnelFlythrough,log=document.getElementById('log');
const check=(value,message)=>{if(!value)throw Error(message);log.textContent+='PASS: '+message+'\n';};
window.__bridgePortalSmoke={state:'running'};
(async()=>{
 const longitude=8.6,latitude=46.7,scale=6378137*Math.PI/180,deckFloor=500;
 const tilingScheme=new C.GeographicTilingScheme({rectangle:C.Rectangle.fromDegrees(
  longitude-.0015,latitude-.0015,longitude+.0015,latitude+.0015),numberOfLevelZeroTilesX:1,numberOfLevelZeroTilesY:1});
 const provider=new C.CustomHeightmapTerrainProvider({width:129,height:129,tilingScheme,
  callback(x,y,level){const rectangle=tilingScheme.tileXYToRectangle(x,y,level),buffer=new Float32Array(129*129);
   for(let row=0;row<129;row++){
    const lat=rectangle.north+(rectangle.south-rectangle.north)*row/128;
    const north=(C.Math.toDegrees(lat)-latitude)*scale;
    for(let column=0;column<129;column++)buffer[row*129+column]=north< -4?450:530;
   }return buffer;}});
 provider.getLevelMaximumGeometricError=()=>.01;
 const viewer=new C.Viewer('viewer',{baseLayer:false,baseLayerPicker:false,geocoder:false,homeButton:false,
  sceneModePicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,
  infoBox:false,selectionIndicator:false,terrainProvider:provider,
  contextOptions:{webgl:{preserveDrawingBuffer:true,alpha:false}}});
 window.bridgePortalSmokeViewer=viewer;
 const scene=viewer.scene;scene.skyBox.show=false;scene.skyAtmosphere.show=false;
 viewer.resolutionScale=.65;
 scene.sun.show=false;scene.moon.show=false;scene.fog.enabled=false;
 scene.globe.enableLighting=false;scene.globe.baseColor=C.Color.fromBytes(40,180,70);
 scene.globe.showGroundAtmosphere=false;scene.globe.depthTestAgainstTerrain=true;
 scene.backgroundColor=C.Color.fromBytes(16,24,32);scene.screenSpaceCameraController.enableCollisionDetection=false;
 const errors=[];scene.renderError.addEventListener((_,error)=>errors.push(String(error)));
 const enu=C.Transforms.eastNorthUpToFixedFrame(C.Cartesian3.fromDegrees(longitude,latitude,deckFloor));
 const world=(x,y,z)=>C.Matrix4.multiplyByPoint(enu,new C.Cartesian3(x,y,z),new C.Cartesian3());
 const point=(north,height=500.5,east=0)=>({longitude:longitude+east/(scale*Math.cos(C.Math.toRadians(latitude))),
  latitude:latitude+north/scale,height});
 const along=position=>(position.latitude-latitude)*scale;
 function camera(eye,target){const a=world(...eye),b=world(...target);
  viewer.camera.setView({destination:a,orientation:{
   direction:C.Cartesian3.normalize(C.Cartesian3.subtract(b,a,new C.Cartesian3()),new C.Cartesian3()),
   up:C.Matrix4.multiplyByPointAsVector(enu,new C.Cartesian3(0,0,1),new C.Cartesian3())}});
 }
 const frame=()=>new Promise(resolve=>{const remove=scene.postRender.addEventListener(()=>{remove();resolve();});scene.requestRender();});
 camera([8,-23,8],[0,-1,1]);
 const deadline=performance.now()+20000;
 do {await frame();if(performance.now()>deadline)throw Error('Bridge cliff Globe tile timeout');}while(!scene.globe.tilesLoaded);
 check(scene.globe._surface._tilesToRender.some(tile=>tile.data?.renderedMesh),'Real heightmap Globe cliff is loaded');
 const deckPoints=[[-4,-35,0],[4,-35,0],[4,0,0],[-4,0,0]].map(p=>world(...p));
 const values=deckPoints.flatMap(p=>[p.x,p.y,p.z]);
 scene.primitives.add(new C.Primitive({asynchronous:false,allowPicking:false,
  geometryInstances:new C.GeometryInstance({geometry:new C.Geometry({attributes:{position:new C.GeometryAttribute({
   componentDatatype:C.ComponentDatatype.DOUBLE,componentsPerAttribute:3,values:new Float64Array(values)})},
   indices:new Uint16Array([0,1,2,0,2,3]),primitiveType:C.PrimitiveType.TRIANGLES,
   boundingSphere:C.BoundingSphere.fromVertices(values)}),attributes:{color:C.ColorGeometryInstanceAttribute.fromColor(C.Color.fromBytes(220,120,25))}}),
  appearance:new C.PerInstanceColorAppearance({flat:true,translucent:false,closed:false,
   renderState:{depthTest:{enabled:true},depthMask:true,cull:{enabled:false}}})}));
 let clock=1000,simulating=true;
 const service=T.create(C,viewer,()=>{},{now:()=>clock,isSimulating:()=>simulating});
 const sourceSections=[[0,500],[20,498],[40,498],[60,498]].map(([north,floor])=>({
  ...point(north),floorMetersWgs84:floor,widthMeters:8,heightMeters:5}));
 service.importModel({version:1,elevationReference:'WGS84_ELLIPSOID',source:'Bridge grade mismatch fixture',
  profile:'rectangular',sections:sourceSections});
 // This metadata represents a validated five-point connected flat bridge
 // profile. The bore grade remains independently -10% inside its mouth.
 service.model.portalApproachProfiles=[{grade:0},null];
 service.model.portalApproachKinds=['bridge',null];service.model.portalEnds=[true,false];
 service.activate();
 const adapter=FPVFlightRendering.create(C,viewer,{terrainPassage:service.segmentInside});
 const rawAdapter=FPVFlightRendering.create(C,viewer);
 const flightPoses=[],floorProbes=[];
 const simulator=FPVFreeFlight.createSimulator({sampleHeight:async()=>deckFloor,
  renderedHeight:p=>{const floor=service.floorAt(p)??adapter.renderedHeight(p);floorProbes.push({along:along(p),height:p.height,floor});return floor;},
  modeledCollision:(a,b)=>service.intersects(a,b)?'tunnel':false,terrainCollision:adapter.terrainCollision,
  captureCamera:()=>({heading:0}),restoreCamera(){},applyGraphics(){},isTerrainReady:()=>true,onState(){},
  applyPose:p=>{clock+=500;flightPoses.push({along:along(p),height:p.height,agl:p.agl,reason:p.reason});adapter.applyPose(p);}});
 await simulator.start({...point(-15),flightMode:'gps',agl:1,maxSpeed:4,acceleration:8},new AbortController().signal);
 simulator.enterTunnel({...point(-15),height:deckFloor+.5,ground:deckFloor,heading:0});
 flightPoses.length=0;
 await frame();await frame();
 const entrySpec=service.apertureSpecs().find(spec=>spec.forward.north>.9);
 check(entrySpec&&Math.abs(entrySpec.grade+.1)<1e-6,'Bore keeps its 2 m descent over the first 20 m');
 check(Math.abs(entrySpec.approachGrade)<1e-8,'Selected aperture uses the independent flat bridge approach grade');
 check(Math.abs(service.floorAt(point(-15))-500)<1e-6,'At 15 m outside, the physical entry floor stays at 500 m rather than extrapolating to 501.5 m');
 check(Math.abs(service.floorAt(point(10,500.5))-499)<1e-5,'Inside, the modeled bore floor still descends to 499 m');
 check(rawAdapter.terrainCollision(point(-6),point(-2)),'Original Globe triangles physically intersect the low bridge entry');
 check(service.segmentInside(point(-6),point(-2))&&!adapter.terrainCollision(point(-6),point(-2)),
  'Production passage adapter exempts only the cleared bridge-to-mouth corridor');
 const sideA=point(-6,500.5,12),sideB=point(-2,500.5,12);
 check(!service.segmentInside(sideA,sideB)&&adapter.terrainCollision(sideA,sideB),'Rock beside the bridge retains terrain collision');
 // Recreate only the former grade choice against the SAME public geometry
 // helpers and actual terrain adapter. At low clearance it raised the false
 // approach floor and stopped the simulator before reaching the mouth.
 const legacySpec={...entrySpec,approachGrade:entrySpec.grade};
 const legacyContains=p=>T.inside(service.model,p)||T.portalApproachFloor(service.model,p,0,legacySpec)!==null;
 const legacyPassage=(a,b)=>{
  const steps=Math.max(1,Math.ceil(Math.hypot(along(b)-along(a),b.height-a.height)/.5));
  for(let i=0;i<=steps;i++){
   const t=i/steps,p={longitude:a.longitude+(b.longitude-a.longitude)*t,
    latitude:a.latitude+(b.latitude-a.latitude)*t,height:a.height+(b.height-a.height)*t};
   if(!legacyContains(p))return false;
  }return true;
 };
 const legacyAdapter=FPVFlightRendering.create(C,viewer,{terrainPassage:legacyPassage});
 const legacySimulator=FPVFreeFlight.createSimulator({sampleHeight:async()=>deckFloor,
  renderedHeight:p=>T.inside(service.model,p)?T.closest(service.model,p).floor:
   T.portalApproachFloor(service.model,p,0,legacySpec,.25,true)??legacyAdapter.renderedHeight(p),
  modeledCollision:(a,b)=>service.intersects(a,b)?'tunnel':false,terrainCollision:legacyAdapter.terrainCollision,
  captureCamera:()=>({heading:0}),restoreCamera(){},applyGraphics(){},isTerrainReady:()=>true,onState(){},applyPose(){}});
 await legacySimulator.start({...point(-15),flightMode:'gps',agl:1,maxSpeed:4,acceleration:8},new AbortController().signal);
 legacySimulator.enterTunnel({...point(-15),height:deckFloor+.5,ground:deckFloor,heading:0});legacySimulator.stick(1,0);
 for(let tick=0;tick<720;tick++){
  legacySimulator.tick(1/60);if(legacySimulator.status().reason)break;
 }
 const legacyFinal=legacySimulator.status();
 check(legacyFinal.reason==='Terrain contact: movement stopped'&&legacyFinal.distance>1&&along(legacyFinal.position)<-.5,
  'Control reproduces the former floor lip: extrapolating the bore grade stops actual low flight before the portal');
 legacySimulator.stop();
 let refreshedNearMouth=false;
 simulator.stick(1,0);
 for(let tick=0;tick<720&&along(simulator.status().position)<7;tick++){
  simulator.tick(1/60);
  const position=simulator.status().position;
  if(!refreshedNearMouth&&along(position)>-4.8&&along(position)<0){
   refreshedNearMouth=true;await frame();await frame();
   const nearFloor=service.floorAt({...position,height:500.5});
   window.__bridgePortalSmoke.context={legacyFinal,nearMouthAlong:along(position),nearFloor,nearSpecs:service.apertureSpecs()};
   check(Math.abs(nearFloor-500)<1e-6,'Refreshing the moving flight aperture near the mouth retains the real 500 m bridge floor');
  }
  if(tick%120===0)await new Promise(resolve=>setTimeout(resolve,0));
  const state=simulator.status();if(state.reason)throw Error('Unexpected entry stop: '+JSON.stringify(state));
 }
 simulator.stick(0,0);const final=simulator.status();
 check(along(final.position)>6.5,'Actual free-flight ticks cross the cliff and source portal into the descending bore');
 check(flightPoses.every(p=>Math.abs(p.height-500.5)<1e-7),'Entry never raises or teleports the drone from its actual 0.5 m bridge clearance');
 const lowApproach=flightPoses.filter(p=>p.along<-.1&&p.agl!==null);
 check(lowApproach.length>20&&lowApproach.every(p=>Math.abs(p.agl-.5)<1e-6),'Flight reports a genuine 0.5 m AGL along the flat bridge approach');
 check(final.reason===null&&final.height<501,'No floor lip collision, braking, or height snap occurs at the mouth');
 // Return to the exterior for pixel evidence that the bridge road survives
 // and the production tunnel lining is visible behind the removed cliff.
 simulating=false;camera([8,-23,8],[0,-1,1]);clock+=1000;await frame();await frame();
 async function pixel(at){const image=await createImageBitmap(await new Promise(resolve=>viewer.canvas.toBlob(resolve)));
  const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;
  const context=canvas.getContext('2d');context.drawImage(image,0,0);image.close();
  const p=C.SceneTransforms.worldToWindowCoordinates(scene,at);
  const rgba=Array.from(context.getImageData(Math.round(p.x*canvas.width/viewer.canvas.clientWidth),Math.round(p.y*canvas.height/viewer.canvas.clientHeight),1,1).data);
  return {rgba,green:rgba[1]>rgba[0]*1.8&&rgba[1]>rgba[2]*1.4&&rgba[1]>70};}
 const bridgePixel=await pixel(world(0,-10,0));
 check(bridgePixel.rgba[0]>150&&bridgePixel.rgba[0]>bridgePixel.rgba[1]*1.4,'Horizontal bridge deck remains opaque and visible');
 const borePixel=await pixel(world(0,5,-.5));
 check(!borePixel.green&&borePixel.rgba[0]>20,'Descending tunnel floor remains visible through the cleared entrance');
 check(!errors.length,'No real Globe or production tunnel shader errors');
 window.__bridgePortalSmoke={state:'passed',entrySpec,legacyFinal,final,bridgePixel,borePixel,
  approachPoses:lowApproach.length,minimumApproachAgl:Math.min(...lowApproach.map(p=>p.agl)),
  maximumApproachAgl:Math.max(...lowApproach.map(p=>p.agl)),floorProbes:floorProbes.filter((_,index)=>index%30===0)};
 document.getElementById('status').textContent='PASS: bridge entry at actual 0.5 m AGL; no 1.5 m false floor, teleport or terrain collision';
})().catch(error=>{window.__bridgePortalSmoke={state:'failed',context:window.__bridgePortalSmoke.context,error:String(error.stack||error)};
 document.getElementById('status').textContent='FAIL: '+error;log.textContent+='\n'+String(error.stack||error);});
</script></html>
