name: Prepare Swiss tunnel offline index (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install osmium for one-time PBF import
        run: python -m pip install 'osmium>=4.0,<5'
      - name: Build full Swiss offline index from Geofabrik PBF
        run: python tool/build_ch_tunnel_index.py --download
      - name: Verify non-empty output
        run: python tool/build_ch_tunnel_index.py --verify
      - name: Upload generated offline asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fpvmanager-swiss-tunnel-index
          path: web/data/tunnels/ch_tunnels_v1.json
          if-no-files-found: error
          retention-days: 30
