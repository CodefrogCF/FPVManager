name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  quality:
    name: Analyze, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart run tool/quality/check_format.dart
      - name: Set up Python for tooling tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/data/offline_region_requirements.txt
      - name: Install Python tooling test dependencies
        run: |
          python -m pip install --only-binary=:all: --requirement tool/data/offline_region_requirements.txt
      - name: Verify bundled Cesium resources
        run: python tool/build/vendor_cesium.py --check
      - name: Verify application version
        run: python tool/quality/check_version.py
      - name: Verify documentation links
        run: python tool/quality/check_docs.py
      - name: Verify repository tool layout
        run: python tool/quality/check_repository_layout.py
      - name: Test Python tooling
        run: python -m unittest discover -s test/tool -p 'test_*.py'
      - name: Test renderer protocol, terrain and map interactions
        run: node --test test/js/*.test.cjs
      - name: Enforce synthetic performance protocol invariants
        run: node tool/benchmarks/performance_suite.cjs --check
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Test web input and offline storage
        run: flutter test --no-pub --platform chrome test/web/globe_input_test.dart test/web/offline_storage_test.dart

  web:
    name: Web release build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build web
        run: flutter build web --release --no-pub --no-web-resources-cdn
      - name: Prepare verified offline application snapshot
        run: python3 tool/build/prepare_offline_web.py
      - name: Verify release Web assets
        run: python3 tool/quality/check_release_artifacts.py --web build/web

  android:
    name: Android debug build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Prepare verified SQLite Android libraries
        run: python3 tool/build/prepare_sqlite_android.py
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Build Android
        run: flutter build apk --debug --no-pub
      - name: Verify Android package assets
        run: python3 tool/quality/check_release_artifacts.py --apk build/app/outputs/flutter-apk/app-debug.apk
